# GS Projeler - Hostinge otomatik yükleme (FTP)
#
# Kurulum (bir kez):
#   GitHub > Settings > Secrets and variables > Actions > New repository secret
#     FTP_SERVER     : ftp.alanadiniz.com veya hostingin verdiği sunucu adresi / IP
#     FTP_USERNAME   : FTP kullanıcı adı
#     FTP_PASSWORD   : FTP şifresi
#     FTP_SERVER_DIR : Yükleme klasörü, sonunda / ile (cPanel için genelde: public_html/)
#
# Kullanım: Actions > "Hostinge Yükle" > Run workflow
#   - İlk kurulumda "Kurulum sihirbazını da yükle" seçeneğini işaretleyin.
#   - Sonraki güncellemelerde işaretlemeyin (install klasörü yüklenmez).
# config.php, veritabanı ve sunucudaki diğer dosyalar hiçbir zaman ezilmez.

name: Hostinge Yükle

on:
  workflow_dispatch:
    inputs:
      include_installer:
        description: "Kurulum sihirbazını da yükle (yalnızca ilk kurulumda)"
        type: boolean
        default: false
      protocol:
        description: "Bağlantı türü"
        type: choice
        options: [ftps, ftp]
        default: ftps

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP söz dizimi kontrolü
        run: find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Yükle (kurulum sihirbazı dahil)
        if: ${{ inputs.include_installer }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ inputs.protocol }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            README.md
            config.php
            storage/*.sqlite

      - name: Yükle (güncelleme)
        if: ${{ !inputs.include_installer }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ inputs.protocol }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            README.md
            config.php
            storage/*.sqlite
            install/**
