<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- ARTIFACT-START -->
<title>Galeri Patronu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Düzen: üstte sabit patron paneli (kasa, saat, hız), ortada sekme içeriği, altta uygulama sekme çubuğu.
   Araç kartlarında ön camdaki sarı fiyat etiketi tek vurgulu öğe. */
:root {
  --bg: #e6f4ef;
  --surface: #ffffff;
  --surface-2: #f2f4f7;
  --ink: #17202b;
  --muted: #5c6977;
  --line: #d2e2dc;
  --accent: #00a676;
  --accent-ink: #ffffff;
  --accent-soft: #d2f5e8;
  --sticker: #ffd23f;
  --sticker-ink: #1d1a10;
  --good: #0fa958;
  --warn: #e07b00;
  --bad: #e8304a;
  --ground: #cfd5dc;
  --plate: #1f4fa8;
  --hero-1: #00936b; --hero-2: #00b88a; --hero-3: #14b8d4;
  --pop: #ff3d7f; --violet: #7b5cff;
  --shadow: 0 1px 2px rgba(20, 30, 40, .08), 0 4px 14px rgba(20, 30, 40, .06);
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-num: "Saira", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1320; --surface: #142033; --surface-2: #1b2a40; --ink: #eaf2fb; --muted: #9db0c6; --line: #263851;
    --accent: #2fe0a8; --accent-ink: #032419; --accent-soft: #123b33; --good: #35e08a; --warn: #ffab2e; --bad: #ff5a70;
    --hero-1: #006e57; --hero-2: #00946f; --hero-3: #0d8fb3;
    --ground: #26313d; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1320; --surface: #142033; --surface-2: #1b2a40; --ink: #eaf2fb; --muted: #9db0c6; --line: #263851;
  --accent: #2fe0a8; --accent-ink: #032419; --accent-soft: #123b33; --good: #35e08a; --warn: #ffab2e; --bad: #ff5a70;
  --hero-1: #006e57; --hero-2: #00946f; --hero-3: #0d8fb3;
  --ground: #26313d; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Üst panel */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px;
}
.top-in { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.top-row { display: flex; align-items: center; gap: 10px; }
.gname { font: 800 20px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { text-align: right; line-height: 1.1; }
.clock b { font: 600 17px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.clock small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.speed { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.speed button { border: 0; background: transparent; padding: 6px 9px; font: 600 13px/1 var(--font-num); color: var(--muted); min-width: 34px; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.kpis { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 12px; }
.kpi { min-width: 0; }
.kpi-l { font: 600 10.5px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#kMoney { font-size: 21px; }
#kMoney[data-len="l"] { font-size: 18px; }
#kMoney[data-len="xl"] { font-size: 15.5px; }
.kpi-v { font: 700 17px/1.25 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-v.neg { color: var(--bad); }
.meter { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.ticker { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.ticker span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker b { color: var(--ink); font-weight: 600; }
.daybar { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.daybar i { display: block; height: 100%; background: var(--sticker); }

/* İçerik */
.view {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(88px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
}
.vh { display: flex; align-items: end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.vh h2 { font: 800 24px/1 var(--font-display); text-transform: uppercase; margin: 0; letter-spacing: .01em; }
.vh p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.segctl { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; overflow-x: auto; }
.segctl button { flex: 1; border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 600; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.segctl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.strip { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.pill b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 22px 18px; color: var(--muted); text-align: center; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* Araç kartı */
.ccard { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; display: grid; text-align: left; border: 1px solid transparent; }
.ccard:hover { border-color: var(--line); }
.cimg { position: relative; background: linear-gradient(var(--surface-2) 0 74%, var(--ground) 74% 100%); padding: 10px 12px 2px; }
.cimg svg { display: block; width: 100%; max-width: 250px; height: auto; margin: 0 auto; }
.sticker {
  position: absolute; top: 8px; right: 10px; background: var(--sticker); color: var(--sticker-ink);
  font: 700 14px/1 var(--font-num); font-variant-numeric: tabular-nums; padding: 6px 8px 5px; border-radius: 3px;
  transform: rotate(2deg); box-shadow: 0 2px 4px rgba(0, 0, 0, .18);
}
.sticker.none { background: var(--surface); color: var(--muted); border: 1px dashed var(--line); box-shadow: none; transform: none; font-weight: 600; font-size: 12px; }
.cstat { position: absolute; top: 8px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 60%; }
.cbody { padding: 10px 12px 12px; display: grid; gap: 7px; }
.ctitle { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ctitle b { font-weight: 700; font-size: 15.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate {
  display: inline-flex; align-items: stretch; border: 1.5px solid #1b1f24; border-radius: 3px; background: #fff; color: #111;
  font: 700 12px/1 var(--font-display); letter-spacing: .06em; white-space: nowrap; overflow: hidden; flex: none;
}
.plate i { background: var(--plate); color: #fff; font-style: normal; font-size: 8px; padding: 3px 2px 0; display: flex; align-items: flex-end; }
.plate span { padding: 3px 5px 2px; }
.cspec { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-size: 11.5px; font-weight: 600; padding: 3px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.chip.acc { background: var(--accent); color: var(--accent-ink); }
.chip.dark { background: rgba(15, 20, 25, .78); color: #fff; }
.bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bar-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.bar-l b { font-family: var(--font-num); color: var(--ink); font-weight: 600; }
.bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 2px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--good); }
.bar i.warn { background: var(--warn); }
.bar i.bad { background: var(--bad); }
.cfoot { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 7px; }
.cfoot b { color: var(--ink); font-family: var(--font-num); font-weight: 600; }

/* Liste satırları ve kartlar */
.card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 10px; }
.card h3 { margin: 0; font: 700 18px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
.card p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row > div { min-width: 0; }
.list { display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.kv div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.kv span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kv b { font: 600 15px/1.3 var(--font-num); font-variant-numeric: tabular-nums; display: block; overflow-wrap: anywhere; }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.warn { background: var(--sticker); color: var(--sticker-ink); border-color: var(--sticker); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 7px; }
.btn.block { width: 100%; }
a.btn { text-decoration: none; color: inherit; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1; }

.job { display: grid; gap: 6px; }
.prog { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .2s linear; }
.prog.pat i { background: var(--warn); }

.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.opt:first-child { border-top: 0; }
.opt small { display: block; color: var(--muted); font-size: 12.5px; }

/* Alt sekme çubuğu */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: transparent; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; }
.nav svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--bad); color: #fff; font: 700 10.5px/1 var(--font-num); min-width: 17px; height: 17px; padding: 3px 4px 0; border-radius: 9px; text-align: center; }

/* Alt sayfa (sheet) */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; justify-items: center; }
.scrim { position: absolute; inset: 0; background: rgba(8, 12, 16, .5); }
.sheet {
  position: relative; width: 100%; max-width: 620px; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 16px 16px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 12px; align-content: start;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 0; }
.sh-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.sh-head h2 { margin: 0; font: 800 24px/1.05 var(--font-display); text-transform: uppercase; }
.sh-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.x { border: 0; background: var(--surface); width: 34px; height: 34px; border-radius: 50%; font-size: 20px; line-height: 1; flex: none; }
.hero { background: linear-gradient(var(--surface-2) 0 76%, var(--ground) 76% 100%); border-radius: 12px; padding: 14px 14px 0; position: relative; }
.hero svg { display: block; width: 100%; max-width: 360px; margin: 0 auto; height: auto; }

.chat { display: grid; gap: 6px; }
.msg { max-width: 85%; padding: 8px 11px; border-radius: 12px; font-size: 14px; }
.msg.them { background: var(--surface); justify-self: start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 4px; }
.msg.sales { background: var(--accent-soft); justify-self: center; font-size: 13px; }

.range { display: grid; gap: 6px; }
.range input { width: 100%; accent-color: var(--accent); height: 28px; }
.range-out { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.range-out b { font: 700 24px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick .btn { flex: 1; padding: 6px 4px; font-size: 12.5px; }

.auc-big { font: 700 34px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.auc-log { display: grid; gap: 3px; font-size: 13px; color: var(--muted); max-height: 120px; overflow: hidden; }
.auc-log div:first-child { color: var(--ink); font-weight: 600; }

.chart { width: 100%; max-width: 520px; height: auto; display: block; }
.chart text { fill: var(--muted); font: 10px var(--font-body); }

.toasts { position: fixed; z-index: 30; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 8px); display: grid; justify-items: center; gap: 6px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { pointer-events: auto; max-width: 520px; width: 100%; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); border-left: 4px solid var(--accent); text-align: left; border-top: 0; border-right: 0; border-bottom: 0; }
.toast.good { border-left-color: var(--good); }
.toast.bad { border-left-color: var(--bad); }
.toast.level { border-left-color: var(--sticker); }
.toast.offer { border-left-color: var(--sticker); cursor: pointer; }

.field { display: grid; gap: 6px; }
.field input[type="text"] { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 11px 12px; font-size: 16px; }
.intro-art { background: linear-gradient(var(--surface-2) 0 70%, var(--ground) 70% 100%); border-radius: 12px; padding: 16px 10px 0; display: flex; justify-content: center; gap: 4px; overflow: hidden; }
.intro-art svg { width: 33%; height: auto; flex: none; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* Galeri sahnesi */
.scene-card { width: 100%; max-width: 720px; justify-self: center; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: #9aa3ac; }
.scene { display: block; width: 100%; height: auto; }
.scene .hit { cursor: pointer; }
.scene .hit:hover { filter: brightness(1.08); }
.scene .walk { animation: walk 6s ease-in-out infinite alternate; }
.scene .drop { animation: drop 0.9s linear infinite; }
.scene .bubble { animation: bob 1.6s ease-in-out infinite; }
@keyframes walk { from { translate: -14px 0; } to { translate: 14px 0; } }
@keyframes drop { from { translate: 0 -3px; opacity: 1; } to { translate: 0 8px; opacity: 0; } }
@keyframes bob { 50% { translate: 0 -2px; } }
.scene-cap { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--surface); font-size: 13px; color: var(--muted); }
.scene-cap b { color: var(--ink); font-family: var(--font-num); }

.spark { animation: spark 1.6s ease-in-out infinite alternate; }
@keyframes spark { from { opacity: .15; } to { opacity: 1; } }
.scene .led { animation: led 1.4s steps(2) infinite; }
.scene .twinkle { animation: led 1.1s ease-in-out infinite alternate; }
.scene .glow { animation: glow 2.4s ease-in-out infinite alternate; }
.scene .pulse { animation: glow 1.8s ease-in-out infinite alternate; }
.scene .hue { animation: hue 3s linear infinite alternate; }
.scene .wave { transform-box: fill-box; transform-origin: left center; animation: wave 1.2s ease-in-out infinite alternate; }
.scene .bob { animation: bob 2s ease-in-out infinite; }
.scene .spin { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
.scene .brush { animation: brush .5s linear infinite alternate; }
.scene .bub { animation: bub 1.6s ease-out infinite; }
.scene .smoke { animation: bub 2.2s ease-out infinite; }
.scene .beam { animation: beam 3s ease-in-out infinite alternate; }
@keyframes led { 50% { opacity: .35; } }
@keyframes glow { from { opacity: .45; } to { opacity: 1; } }
@keyframes hue { from { fill: #ff7ad9; } to { fill: #5ef2ff; } }
@keyframes wave { from { transform: skewY(-6deg) scaleX(.9); } to { transform: skewY(6deg) scaleX(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes brush { from { transform: scaleX(.6); } to { transform: scaleX(1.15); } }
@keyframes bub { from { translate: 0 0; opacity: .9; } to { translate: 0 -8px; opacity: 0; } }
@keyframes beam { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }

/* Tesisler ve ustalar */
.pips { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
.pips i { height: 7px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.pips i.on { background: var(--accent); border-color: var(--accent); }
ul.facl { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; }
ul.facl li.up { color: var(--good); font-weight: 600; }
.card.fac .row .btn { flex: none; }
.energy { display: grid; grid-template-columns: auto minmax(0, 1fr) 26px; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); margin-top: 4px; max-width: 220px; }
.energy b { font-family: var(--font-num); color: var(--ink); text-align: right; }
.energy .bar { margin: 0; }

/* İlan filtresi */
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fsel { display: grid; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; min-width: 0; }
.fsel select { font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; width: 100%; }
.ftog { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ftog .muted { margin-left: auto; }
.speed button[data-a="skip"] { color: var(--ink); border-left: 1px solid var(--line); }

/* Ultra lüks ve pasif gelir */
.chip.gold { background: linear-gradient(90deg, #d4a72c, #f3d46b); color: #2a1f00; }
.crow.ultra { border: 2px solid #d4a72c; background: linear-gradient(90deg, color-mix(in srgb, #d4a72c 14%, var(--surface)), var(--surface) 60%); }
.welcome { text-align: center; justify-items: center; }
.big-money { font: 800 34px/1.1 var(--font-num); color: var(--good); font-variant-numeric: tabular-nums; }

/* Lüks */
.lux-head .fame { text-align: center; background: var(--sticker); color: var(--sticker-ink); border-radius: 10px; padding: 6px 12px; flex: none; }
.lux-head .fame span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.lux-head .fame b { font: 800 24px/1 var(--font-num); }
.lux-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.lux-card { background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); display: grid; border: 2px solid transparent; }
.lux-card.own { border-color: var(--good); }
.lux-card.locked .lux-art { filter: grayscale(.7); opacity: .75; }
.lux-art { position: relative; }
.lux-art svg { display: block; width: 100%; height: auto; }
.own-tag { position: absolute; top: 8px; left: 8px; }
.lux-body { padding: 10px 12px 12px; display: grid; gap: 6px; }
.lux-body p { margin: 0; }
.segctl button small { font-weight: 600; opacity: .7; font-size: 11px; }
.segctl.wrap3 { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; }
.card.party { border: 1.5px dashed var(--sticker); }
.card.party .btn, .lux-body .btn { flex: none; white-space: nowrap; }
.scene .fly { animation: fly 26s linear infinite; }
@keyframes fly { from { transform: translateX(-40px); } to { transform: translateX(440px); } }
.rotor { transform-box: fill-box; transform-origin: center; animation: rotor .25s linear infinite; }
@keyframes rotor { 50% { transform: scaleX(.15); } }
svg .spin { transform-box: fill-box; transform-origin: center; animation: rotor .2s linear infinite; }

/* Yapılacaklar */
.todo { gap: 8px; }
.todo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.todo-row:first-of-type { border-top: 0; padding-top: 0; }
.todo-row span { min-width: 0; }
.todo-row .btn { flex: none; }
.todo-row.hot span { font-weight: 600; }

/* Kompakt araç satırları */
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; }
.crow { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 12px; padding: 8px 12px 8px 8px; box-shadow: var(--shadow); cursor: pointer; border: 1px solid transparent; }
.crow:hover { border-color: var(--line); }
.crow-img { background: linear-gradient(var(--surface-2) 0 72%, var(--ground) 72% 100%); border-radius: 8px; padding: 6px 4px 0; }
.crow-img svg { display: block; width: 100%; height: auto; }
.crow-main { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.crow-main b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.crow-main > span:not(.chip) { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.crow-side { display: grid; justify-items: end; gap: 4px; text-align: right; }
.crow-side small { font-size: 12px; font-weight: 600; white-space: nowrap; }
.sticker.sm { position: static; font-size: 13px; padding: 5px 7px 4px; transform: rotate(2deg); white-space: nowrap; }

/* Araç sayfası */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles div { background: var(--surface); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.tiles span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tiles b { font: 700 15px/1.3 var(--font-num); font-variant-numeric: tabular-nums; display: block; overflow-wrap: anywhere; }
.step { display: grid; gap: 8px; }
.step > h3 { margin: 4px 0 0; display: flex; align-items: center; gap: 8px; font: 700 17px/1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.step .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--surface); font: 700 12px/1 var(--font-num); }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.preset { display: grid; gap: 2px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.preset span { font-size: 12px; font-weight: 600; color: var(--muted); }
.preset b { font: 700 16px/1.2 var(--font-num); font-variant-numeric: tabular-nums; }
.preset small { font-size: 11.5px; font-weight: 600; }
.preset em { font-style: normal; font-size: 11px; color: var(--muted); }
.preset.on { border-color: var(--accent); background: var(--accent-soft); }
.rec { grid-template-columns: minmax(0, 1fr); }
.rec p { margin-top: 2px; }
details.more { background: var(--surface); border-radius: 10px; padding: 0 12px; }
details.more > summary { cursor: pointer; padding: 11px 0; font-weight: 600; font-size: 14px; color: var(--accent); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: " ▾"; }
details.more[open] { padding-bottom: 12px; display: grid; gap: 10px; }
details.more[open] > summary::after { content: " ▴"; }
.link { border: 0; background: none; color: var(--bad); font-size: 13px; padding: 2px 0; justify-self: start; text-decoration: underline; }
.big-btns .btn { padding: 12px 14px; font-size: 15px; }
.pat-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.num.big { font-weight: 700; font-size: 18px; }
.offer .btns .btn { flex: 1 1 auto; }

/* Reklam düğmeleri ve katmanı */
.btn.ad { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn.ad svg { width: 14px; height: 14px; }
.btn.ad small { font-size: 11px; opacity: .75; font-weight: 600; }
.card.boost, .card.bonus { border: 1.5px dashed var(--accent); }
.ilan-info .btn.ad, .boost .btn.ad { flex: none; white-space: nowrap; }
.btn.ad.big { padding: 13px 14px; font-size: 16px; }
.ad-layer { position: fixed; inset: 0; z-index: 40; background: rgba(5, 8, 12, .86); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ad-box { width: 100%; max-width: 420px; background: var(--surface); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.ad-tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ad-art { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; background: repeating-linear-gradient(135deg, var(--surface-2) 0 14px, var(--bg) 14px 28px); display: grid; place-content: center; text-align: center; gap: 6px; padding: 16px; }
.ad-art span { color: var(--muted); font-size: 13px; }

@media (max-width: 520px) {
  .gname { font-size: 18px; }
  .grid, .rows { grid-template-columns: 1fr; }
  .crow { grid-template-columns: 78px minmax(0, 1fr) auto; }
  .presets { gap: 6px; }
  .preset { padding: 8px; }
  .preset b { font-size: 14px; }
  .small-ctl button { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) { .scene .fly, .rotor, svg .spin, .scene .walk, .scene .drop, .scene .bubble, .scene .led, .scene .twinkle, .scene .glow, .scene .pulse, .scene .hue, .scene .wave, .scene .bob, .scene .spin, .scene .brush, .scene .bub, .scene .smoke, .scene .beam { animation: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .prog i { transition: none; } }

/* Canlı tema: renkli üst panel, parlak düğmeler, belirgin sekmeler */
body::before { background: var(--hero-1); }
.top { background: linear-gradient(120deg, var(--hero-1), var(--hero-2) 55%, var(--hero-3)); border-bottom: 0; color: #fff; box-shadow: 0 4px 18px rgba(0, 110, 85, .28); }
.top .clock small, .top .kpi-l { color: rgba(255, 255, 255, .78); }
.top #kMoney { color: #ffe066; text-shadow: 0 1px 0 rgba(0, 0, 0, .18); }
.top .kpi-v.neg { color: #ffd0d6; }
.top .meter, .top .daybar { background: rgba(255, 255, 255, .25); }
.top .meter i { background: #ffe066; }
.top .speed { border-color: rgba(255, 255, 255, .45); }
.top .speed button { color: rgba(255, 255, 255, .9); }
.top .speed button[aria-pressed="true"] { background: #fff; color: var(--hero-1); }
.top .speed button[data-a="skip"] { color: #fff; border-left-color: rgba(255, 255, 255, .45); }
.top .ticker { background: rgba(255, 255, 255, .16); color: rgba(255, 255, 255, .88); }
.top .ticker b { color: #fff; }
.btn.pri { background: linear-gradient(135deg, var(--hero-2), var(--accent) 60%, var(--hero-1)); border-color: transparent; color: #fff; box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 38%, transparent); }
.btn.warn { box-shadow: 0 3px 10px rgba(255, 190, 0, .35); }
.btn.pri:active, .btn.warn:active { transform: translateY(1px); }
.chip.good { background: color-mix(in srgb, var(--good) 20%, transparent); }
.chip.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); }
.chip.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.chip.acc { background: var(--pop); color: #fff; }
.segctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: linear-gradient(90deg, var(--hero-2), var(--hero-3)); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 4px color-mix(in srgb, var(--accent) 45%, transparent)); }
.card h3 { color: var(--ink); }
.card.todo { border-left: 4px solid var(--sticker); }
.vh h2 { background: linear-gradient(90deg, var(--accent), var(--hero-3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stars { color: #f5b300; letter-spacing: .05em; }

/* Kepenk: galeri açılırken metal kepenk yukarı sarılır */
.shutter { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.shutter-door { position: absolute; inset: 0; display: grid; place-items: center;
  background: repeating-linear-gradient(180deg, #b9c2cc 0 13px, #8d97a3 13px 15px, #d3dae1 15px 17px, #a5afba 17px 30px);
  box-shadow: inset 0 -26px 0 #59626d, inset 0 -30px 0 #3c434c;
  animation: shutter-up 1.35s cubic-bezier(.55, .05, .35, 1) .45s forwards; }
.shutter-door::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 90px; height: 10px; margin-left: -45px; border-radius: 5px; background: #2d333a; }
.shutter-sign { background: linear-gradient(120deg, var(--hero-1), var(--hero-2) 55%, var(--hero-3)); color: #fff; padding: 12px 22px; border-radius: 10px; font: 800 26px/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); max-width: calc(100% - 32px); text-align: center; animation: shutter-shake .45s ease-in-out; }
.shutter-sign small { display: block; font: 700 13px/1.2 var(--font-body); letter-spacing: .08em; color: #ffe066; margin-top: 6px; }
@keyframes shutter-up { 0% { transform: translateY(0); } 8% { transform: translateY(1.5%); } 100% { transform: translateY(-104%); } }
@keyframes shutter-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .shutter-door { animation: shutter-fade .4s ease .2s forwards; } .shutter-sign { animation: none; } @keyframes shutter-fade { to { opacity: 0; } } }

/* Rehber turu: vurgulanan öğenin etrafı açık, ekranın geri kalanı karartılır */
.tour { position: fixed; inset: 0; z-index: 70; }
.tour.dim { background: rgba(5, 12, 22, .62); }
.tour-hole { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(5, 12, 22, .62); outline: 3px solid var(--sticker); outline-offset: 0; transition: all .25s ease; pointer-events: none; }
.tour-card { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: 400px; margin: 0 auto; background: var(--surface); color: var(--ink); border-radius: 16px; padding: 16px; box-shadow: 0 12px 36px rgba(0, 0, 0, .35); display: grid; gap: 8px; border-top: 5px solid var(--accent); animation: tour-in .22s ease; }
.tour-card h3 { margin: 0; font: 800 22px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .01em; }
.tour-card p { margin: 0; font-size: 15px; line-height: 1.45; }
.tour-top { display: flex; justify-content: space-between; align-items: center; }
.tour-n { font: 700 12px/1 var(--font-num); color: var(--muted); letter-spacing: .06em; }
.tour-skip, .tip-off { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; padding: 6px 0 6px 10px; text-decoration: underline; text-underline-offset: 3px; }
.tour-dots { display: flex; gap: 5px; }
.tour-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.tour-dots i.past { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.tour-dots i.on { background: var(--accent); width: 18px; border-radius: 4px; }
.tour-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
.tour-btns .btn { min-width: 96px; padding: 11px 16px; font-size: 15px; }
@keyframes tour-in { from { opacity: 0; transform: translateY(6px); } }

/* Ekran ipucu: bir pencere ilk açılınca üstte çıkar, oyunu durdurmaz */
.tip { position: fixed; z-index: 65; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); border-left: 5px solid var(--sticker); animation: tour-in .22s ease; }
.tip-ic { width: 26px; height: 26px; border-radius: 50%; background: var(--sticker); color: var(--sticker-ink); display: grid; place-items: center; font: 800 16px/1 Georgia, serif; font-style: italic; }
.tip-body { display: grid; gap: 4px; }
.tip-body p { margin: 0; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { .tour-card, .tip { animation: none; } .tour-hole { transition: none; } }
