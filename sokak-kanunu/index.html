<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sokak Kanunu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: üstte durum çubuğu (avatar, seviye, can, para), altında sekmeli şehir paneli; savaş tam ekran: üstte sahne, altta komut paneli.
   Görünüm: gece asfaltı + sodyum sokak lambası turuncusu. Tek, karanlık tema. */
:root{
  --ink:#121417; --panel:#1a1e23; --panel2:#242930; --line:#343b45; --edge:#08090b;
  --text:#ecebe6; --muted:#98a0aa; --accent:#ff9f1c; --accent-d:#a86200; --hp:#e5484d; --en:#3fb6e8; --xp:#c3e75a; --cash:#5fd38d;
  --f-disp:"Bungee",Impact,"Arial Black",sans-serif; --f-body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.btn{font-family:var(--f-body);font-weight:700;font-size:16px;letter-spacing:.02em;background:var(--accent);color:#1f1300;border:0;border-radius:6px;padding:9px 15px;box-shadow:0 3px 0 var(--accent-d);transition:transform .06s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.btn:disabled{cursor:not-allowed;filter:saturate(.2) brightness(.6)}
.btn.alt{background:var(--panel2);color:var(--text);box-shadow:0 3px 0 #0d0f12;border:1px solid var(--line)}
.btn.sm{font-size:14px;padding:6px 11px}
.btn.danger{background:var(--hp);color:#fff;box-shadow:0 3px 0 #8a2226}
.cash{color:var(--cash);font-weight:700;font-variant-numeric:tabular-nums}

.bar{position:relative;height:16px;background:#0b0c0e;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px #2a3038}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .25s}
.bar.hp i{background:linear-gradient(180deg,#ff6b6f,#c9353a)}
.bar.en i{background:linear-gradient(180deg,#6fd0f5,#2a8fc0)}
.bar.xp i{background:linear-gradient(180deg,#d8f57c,#9cc23a)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}

/* ---------- Şehir (hub) ---------- */
#hub{position:fixed;inset:0;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 60% at 50% -10%,#2b2418 0%,rgba(18,20,23,0) 60%),var(--ink)}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,7vw,48px);line-height:.95;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);max-width:52ch}
.status{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.status .av{width:64px;height:72px;background:var(--panel2);border-radius:8px;display:grid;place-items:end center;overflow:hidden}
.status .mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.status .lv{font-family:var(--f-disp);font-size:18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.status .lv small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.status .money{font-size:26px;text-align:right;line-height:1}
.status .money small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
@media (max-width:520px){.status{grid-template-columns:auto 1fr}.status .money{grid-column:1/-1;text-align:left;display:flex;align-items:baseline;gap:10px}.status .money small{margin:0}}
.ptsbadge{background:var(--xp);color:#1d2600;font-family:var(--f-body);font-weight:700;font-size:12px;padding:2px 7px;border-radius:10px}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;font-size:16px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--xp);margin-left:5px;vertical-align:middle}

.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-disp);font-weight:400;font-size:20px;margin:0}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:400px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:start;min-width:0}
.card.eq{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card .ico{width:60px;height:60px;background:var(--panel2);border-radius:8px;display:grid;place-items:center}
.card .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.card .nm{font-weight:700;font-size:18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;line-height:1.15}
.card .st{font-size:14px;color:var(--muted)}
.card .st b{color:var(--text);font-weight:600}
.up{color:var(--xp)}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--accent);color:#1f1300;letter-spacing:.04em;text-transform:uppercase}
.tag.k{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.gun{background:#20384a;color:#9fdcff}
.tag.mel{background:#3a2a20;color:#ffc89a}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pips{display:flex;gap:3px;margin-top:2px}.pips i{width:14px;height:5px;border-radius:2px;background:var(--panel2)}.pips i.on{background:var(--accent)}

/* bölgeler */
.dist{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dist.locked{opacity:.55}
.dist-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;padding:14px;min-height:96px;background-size:cover;background-position:center;position:relative}
.dist-head::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,20,23,.1),rgba(18,20,23,.85))}
.dist-head>*{position:relative}
.dist-head .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.dist-head h3{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:2px 0 0;text-shadow:0 2px 0 #000}
.dist-head p{margin:2px 0 0;color:#cfd3d8;font-size:14px;text-shadow:0 1px 0 #000}
.missions{display:flex;flex-direction:column}
.mis{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.mis .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:700;font-size:14px;border:1px solid var(--line)}
.mis.done .n{background:var(--cash);color:#062b14;border-color:var(--cash)}
.mis.boss .n{background:var(--hp);color:#fff;border-color:var(--hp)}
.mis .t{font-weight:700;line-height:1.2}
.mis .d{font-size:13px;color:var(--muted)}
.mis.lock{opacity:.45}
.dist-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line);background:var(--panel2)}

/* karakter */
.charbox{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:14px}
@media (max-width:600px){.charbox{grid-template-columns:1fr}}
.portrait{background:linear-gradient(180deg,#2b2418,#1a1e23);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;padding:14px;min-height:200px}
.statrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.statrow b{font-size:22px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.statrow .k{font-weight:700}.statrow .k small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.statlist{display:flex;flex-direction:column;gap:8px}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.derived div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.derived b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.derived span{font-size:12px;color:var(--muted)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.skill{padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.skill.lock{opacity:.45}
.skill b{display:flex;justify-content:space-between;gap:8px}
.skill b span{color:var(--en);font-size:13px}
.skill div{font-size:13px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:13px;padding-top:4px}

/* ---------- Savaş ---------- */
#battle{position:fixed;inset:0;display:flex;flex-direction:column;background:#07080a;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.b-stage{flex:1 1 auto;display:grid;place-items:center;position:relative;min-height:0}
#bcv{display:block;touch-action:manipulation}
.b-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;font-weight:700;text-shadow:0 1px 2px #000}
.b-top .t{font-family:var(--f-disp);font-size:14px;letter-spacing:.03em}
.b-panel{flex:0 0 auto;background:var(--panel);border-top:2px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.b-inner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.b-stats{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.b-stats .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin-bottom:2px}
.ammo{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.ammo.empty{color:var(--hp)}
.buffs{display:flex;gap:6px;flex-wrap:wrap;min-height:0}
.buffs span{font-size:12px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.b-log{min-height:44px;font-size:15px;line-height:1.35;color:#d9dce0}
.b-log div:not(:last-child){color:var(--muted);font-size:13px}
.b-acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.b-acts{grid-template-columns:repeat(4,1fr)}}
.b-acts .btn{min-height:48px;font-size:17px;flex-direction:column;gap:0;line-height:1.1}
.b-acts .btn small{font-size:12px;font-weight:600;opacity:.8}
.b-acts .full{grid-column:1/-1}
.b-acts .wait{grid-column:1/-1;text-align:center;color:var(--muted);padding:14px 0;font-weight:600}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,6,8,.72);z-index:5;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .2s ease-out;max-height:100%;overflow:auto}
@keyframes pop{from{transform:translateY(8px);opacity:.3}}
.mbox h2{font-family:var(--f-disp);font-weight:400;font-size:28px;margin:0;line-height:1.05;text-wrap:balance}
.mbox h2.win{color:var(--accent)}.mbox h2.lose{color:var(--hp)}
.mbox p{margin:0;color:var(--muted);text-wrap:pretty}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 14px;text-align:left;background:var(--panel2);border-radius:8px;padding:12px 14px}
.rows b{text-align:right;font-variant-numeric:tabular-nums}
.lvup{background:linear-gradient(90deg,#2d3a12,#1d2410);border:1px solid #5d7a1e;color:var(--xp);border-radius:8px;padding:10px;font-weight:700}
.mbtns{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="hub">
  <div class="wrap">
    <header class="brand">
      <div>
        <h1>Sokak <span>Kanunu</span></h1>
        <p>Şehri çeteler ele geçirdi. Mahalle mahalle temizle, para kazan, donanımını yükselt ve gizli patron Karahan'ı devir.</p>
      </div>
    </header>

    <section class="status" aria-label="Karakter durumu">
      <div class="av"><canvas id="avatar"></canvas></div>
      <div class="mid">
        <div class="lv"><span id="lvTxt">Seviye 1</span><small id="xpTxt">0 / 35 XP</small><span class="ptsbadge" id="ptsBadge" hidden>3 puan</span></div>
        <div class="bar xp"><i id="xpFill"></i></div>
        <div class="bar hp"><i id="hpFill"></i><span id="hpTxt">100 / 100</span></div>
      </div>
      <div class="money"><span class="cash" id="moneyTxt">₺0</span><small>Cüzdan</small></div>
    </section>

    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="map" aria-selected="true">Görevler</button>
      <button class="tab" role="tab" data-tab="char" aria-selected="false">Karakter</button>
      <button class="tab" role="tab" data-tab="wpn" aria-selected="false">Silahçı</button>
      <button class="tab" role="tab" data-tab="arm" aria-selected="false">Giyim &amp; Zırh</button>
      <button class="tab" role="tab" data-tab="mkt" aria-selected="false">Market</button>
    </nav>

    <main id="view"></main>

    <footer class="foot">
      <span id="statsTxt"></span>
      <span style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn alt sm" id="soundBtn">Ses: Açık</button>
        <span id="resetBox"><button class="btn alt sm" id="resetBtn">İlerlemeyi sıfırla</button></span>
      </span>
    </footer>
  </div>
</div>

<div id="battle" hidden>
  <div class="b-stage" id="bStage">
    <canvas id="bcv" aria-label="Savaş sahnesi"></canvas>
    <div class="b-top"><span class="t" id="bTitle">Eski Mahalle</span><span class="cash" id="bMoney">₺0</span></div>
  </div>
  <div class="b-panel" id="bPanel">
    <div class="b-inner">
      <div class="b-stats">
        <div><div class="lbl">CAN</div><div class="bar hp"><i id="bHp"></i><span id="bHpT"></span></div></div>
        <div><div class="lbl">ENERJİ</div><div class="bar en"><i id="bEn"></i><span id="bEnT"></span></div></div>
        <div class="ammo" id="bAmmo"></div>
      </div>
      <div class="buffs" id="bBuffs"></div>
      <div class="b-log" id="bLog" aria-live="polite"></div>
      <div class="b-acts" id="bActs"></div>
    </div>
  </div>
</div>

<div id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
/* =========================================================

   Tüm karakterler, silahlar ve arka planlar kodla çizilir.

const $=s=>document.querySelector(s);

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[(Math.random()*a.length)|0];
const tl=n=>'₺'+Math.floor(n).toLocaleString('tr-TR');
const fmt=n=>Math.floor(n).toLocaleString('tr-TR');
const dec=(n,d=1)=>n.toFixed(d).replace('.',',');
const pct=n=>'%'+Math.round(n*100);
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function tween(dur,fn){return new Promise(res=>{const t0=performance.now();(function step(now){const k=Math.min(1,(now-t0)/dur);fn(k);if(k<1)requestAnimationFrame(step);else res();})(t0);});}

function makeSprite(rows,pal){const h=rows.length,w=rows[0].length,c=mk(w,h),g=c.getContext('2d');for(let y=0;y<h;y++)for(let x=0;x<w;x++){const col=pal[rows[y][x]];if(!col)continue;g.fillStyle=col;g.fillRect(x,y,1,1);}return c;}
function silhouette(c,col){const w=mk(c.width,c.height),g=w.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,w.width,w.height);return w;}
const sprCache=new Map();
function spr(art,pal){const k=art+'|'+pal;let s=sprCache.get(k);if(!s){const img=makeSprite(ART[art],PALS[pal]);s={img,white:silhouette(img,'#ffffff'),w:img.width,h:img.height};sprCache.set(k,s);}return s;}
function paintIcon(cnv,art,pal,box){const s=spr(art,pal);const sc=Math.max(1,Math.floor(Math.min(box/s.w,box/s.h)));cnv.width=s.w*sc*2;cnv.height=s.h*sc*2;cnv.style.width=s.w*sc+'px';cnv.style.height=s.h*sc+'px';const g=cnv.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(s.img,0,0,cnv.width,cnv.height);}
function paintHero(cnv,sc){
  const s=spr('hero','h_'+S.armor),w=WMAP[S.weapon];
  const W=26,H=20;cnv.width=W*sc*2;cnv.height=H*sc*2;cnv.style.width=W*sc+'px';cnv.style.height=H*sc+'px';
  const g=cnv.getContext('2d');g.imageSmoothingEnabled=false;g.scale(sc*2,sc*2);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(9,19,7,1.5,0,0,Math.PI*2);g.fill();
  g.drawImage(s.img,1,1);

}

let AC=null,noiseBuf=null;const lastS={};
function sfx(t){
  if(!S.sound)return;
  try{
    if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended')AC.resume();
    const now=AC.currentTime;if(lastS[t]&&now-lastS[t]<.04)return;lastS[t]=now;
    if(t==='shot'||t==='blast'){const src=AC.createBufferSource();src.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=t==='blast'?900:2200;const g=AC.createGain();const L=t==='blast'?.35:.16;g.gain.setValueAtTime(t==='blast'?.5:.35,now);g.gain.exponentialRampToValueAtTime(.001,now+L);src.connect(f);f.connect(g);g.connect(AC.destination);src.start(now);src.stop(now+L);return;}
    const P={swing:['triangle',300,120,.09,.07],hit:['square',160,60,.1,.09],crit:['square',380,80,.14,.1],miss:['sine',500,300,.12,.05],cash:['square',988,1480,.09,.05],hurt:['sawtooth',220,70,.2,.12],buy:['square',523,1046,.16,.07],up:['triangle',440,1320,.25,.09],lvl:['triangle',523,2093,.5,.1],heal:['sine',380,980,.3,.11],stun:['square',1200,300,.2,.06],win:['triangle',660,1320,.4,.1],lose:['sawtooth',300,40,.8,.12],reload:['square',900,500,.06,.05],bark:['sawtooth',500,200,.1,.08],boss:['sawtooth',90,55,.8,.12]}[t];
    if(!P)return;const o=AC.createOscillator(),g=AC.createGain();o.type=P[0];o.frequency.setValueAtTime(P[1],now);o.frequency.exponentialRampToValueAtTime(P[2],now+P[3]);g.gain.setValueAtTime(P[4],now);g.gain.exponentialRampToValueAtTime(.0008,now+P[3]);o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+P[3]+.03);
  }catch(e){}
}

const isDone=(d,m)=>!!S.done[d+'-'+m];
function missionEnemies(d,m){
  const r=rng(1000+d*50+m*7),pool=DIST[d].pool;
  const n=d===0?[1,2,2,3][m]:[2,2,3,3][m];
  const out=[];for(let i=0;i<n;i++)out.push(pool[(r()*pool.length)|0]);
  if(d===0&&m===1){out[0]='kapkac';out[1]='kapkac';}
  if(d===1&&m===0){out[0]='kopek';out[1]='kopek';}
  return out;
}

function enemyBodyY(e){return e.y-e.sc*8;}
function gunTip(){return{x:PX+BT.pl.ox+20,y:GROUND+38-24};}
async function lungeTo(e){
  const dx=(e.x-34)-PX;sfx('swing');
  await tween(170,k=>BT.pl.ox=dx*easeOut(k));
}
async function backHome(){const s=BT.pl.ox;await tween(150,k=>BT.pl.ox=s*(1-k));}
async function shootAt(e){
  const t=gunTip();sfx(ps().w.id==='pompali'||ps().w.id==='sniper'?'blast':'shot');
  BT.fx.push({k:'flash',x:t.x,y:t.y,life:.08});BT.fx.push({k:'tracer',x1:t.x,y1:t.y,x2:e.x+e.ox-4,y2:enemyBodyY(e)+rand(-4,4),life:.1});
  BT.pl.ox=-3;await wait(70);BT.pl.ox=0;await wait(70);
}
function enemyDefMul(e){return 1-e.def/(e.def+40);}
async function playerStrike(t,mult,opt){
  const p=ps(),w=p.w;const shots=opt.single?1:(w.burst||1);let didMelee=false;
  for(let i=0;i<shots;i++){
    if(t.dead)break;
    if(w.mag){if(BT.ammo<=0){logMsg('Şarjör boş!');break;}BT.ammo--;await shootAt(t);}
    else if(!didMelee){await lungeTo(t);didMelee=true;}
    const sure=BT.focus;const hit=sure||Math.random()<p.acc*(1-t.dodge);
    if(!hit){popOn(t,'ISKA','#b8bec6',13);sfx('miss');if(i===0)logMsg(`${t.name} saldırından kaçtı.`);continue;}
    let dmg=rand(p.dmgMin,p.dmgMax)*mult*(BT.adrenal>0?1.5:1);const crit=sure||Math.random()<p.crit;if(crit)dmg*=1.8;
    dmg=Math.max(1,Math.round(dmg*enemyDefMul(t)));
    if(sure)BT.focus=false;
    hurtEnemy(t,dmg,crit);
    if(i===0)logMsg(`${t.name} için ${crit?'<b style="color:var(--accent)">kritik</b> ':''}${dmg} hasar.`);
    if(w.stun&&!t.dead&&Math.random()<w.stun){t.stun=1;popOn(t,'SERSEMLEDİ','#62b6e0',12);sfx('stun');}
    if(w.splash){for(const o of alive())if(o!==t){hurtEnemy(o,Math.max(1,Math.round(dmg*w.splash*enemyDefMul(o)/enemyDefMul(t))),false);}}
    await wait(w.mag?60:90);
  }
  if(didMelee)await backHome();
}
function hurtEnemy(e,dmg,crit){
  e.hp-=dmg;e.flash=.12;BT.shake=crit?6:3;sfx(crit?'crit':'hit');
  popOn(e,String(dmg),crit?'#ff9f1c':'#ffffff',crit?20:15);
  for(let i=0;i<6;i++)BT.fx.push({k:'p',x:e.x+e.ox,y:enemyBodyY(e),vx:rand(-50,50),vy:rand(-70,10),life:rand(.2,.4),col:crit?'#ff9f1c':'#fff'});
  if(e.hp<=0&&!e.dead){e.hp=0;e.dead=true;S.kills++;BT.money+=e.money;BT.xp+=e.xp;
    if(e.stolen){S.money+=e.stolen;popOn(e,'+'+tl(e.stolen)+' geri','#5fd38d',13);e.stolen=0;}
    logMsg(`${e.name} yere serildi. <span class="cash">+${tl(e.money)}</span>`);sfx('cash');}
}
async function enemyAct(e){
  e.turn++;
  if(e.stun>0){e.stun--;popOn(e,'SERSEM','#62b6e0',12);logMsg(`${e.name} sersemlemiş, hamle yapamıyor.`);await wait(450);return;}
  const sk=e.skills;
  if(sk.includes('summon')&&alive().length<3&&((!e.s1&&e.hp<e.max*.6)||(!e.s2&&e.hp<e.max*.3))){
    if(!e.s1)e.s1=1;else e.s2=1;
    const m=mkEnemy(e.summon,BT.d,3,false);BT.enemies.push(m);layoutEnemies();m.x=m.tx+60;
    logMsg(`${e.name} yardım çağırdı: ${m.name} geldi!`);if(m.id==='kopek')sfx('bark');
    await tween(350,k=>m.x=m.tx+60*(1-easeOut(k)));await wait(200);return;
  }
  if(sk.includes('buff')&&e.turn%4===0){e.atk*=1.2;popOn(e,'ÖFKELENDİ','#ff6b6f',13);logMsg(`${e.name} öfkelendi! Saldırı gücü arttı.`);sfx('boss');await wait(550);return;}
  if(sk.includes('heavy')){
    if(e.charge){e.charge=false;logMsg(`${e.name} tüm gücüyle vurdu!`);await enemyHit(e,2.2);return;}
    if(e.turn%3===0){e.charge=true;popOn(e,'GÜÇ TOPLUYOR','#ff6b6f',12);logMsg(`<b style="color:#ff8a80">${e.name} güç topluyor!</b> Sonraki tur ağır vuracak, savunmaya geçebilirsin.`);await wait(650);return;}
  }
  const hits=sk.includes('double')?2:1;
  for(let i=0;i<hits;i++){if(S.hp<=0)break;await enemyHit(e,hits>1?.7:1);}
}
async function enemyHit(e,mult){
  const p=ps();const gun=e.wpn==='pistol'||e.wpn==='rifle';
  if(gun){sfx(e.wpn==='rifle'?'blast':'shot');const tx=e.x+e.ox-16,ty=enemyBodyY(e)-2;BT.fx.push({k:'flash',x:tx,y:ty,life:.08});BT.fx.push({k:'tracer',x1:tx,y1:ty,x2:PX+BT.pl.ox+4,y2:GROUND+38-16,life:.1});e.ox=3;await wait(80);e.ox=0;}
  else{const dx=(PX+30)-e.x;if(e.id==='kopek')sfx('bark');await tween(160,k=>e.ox=dx*easeOut(k));}
  const hit=Math.random()<e.acc*(1-p.dodge);
  if(!hit){popPl('ISKA','#b8bec6',13);sfx('miss');logMsg(`${e.name} ıskaladı.`);}
  else{
    let dmg=e.atk*mult*rand(.85,1.15)*(1-p.red)*(BT.defend?.5:1)*(BT.weak>0?.7:1);const crit=Math.random()<e.crit;if(crit)dmg*=1.6;dmg=Math.max(1,Math.round(dmg));
    S.hp-=dmg;BT.pl.flash=.14;BT.shake=crit?7:4;sfx('hurt');popPl('-'+dmg,'#ff6b6f',crit?20:16);
    logMsg(`${e.name} sana ${crit?'kritik ':''}${dmg} hasar verdi.`);
    if(e.steal&&S.money>0){const s=Math.min(S.money,Math.round(8+BT.d*14+Math.random()*8));S.money-=s;e.stolen+=s;popPl('-'+tl(s),'#5fd38d',12);logMsg(`${e.name} cüzdanından ${tl(s)} çaldı! Yenersen geri alırsın.`);}
  }
  if(!gun){const s=e.ox;await tween(150,k=>e.ox=s*(1-k));}
  updateBattleUI();
}
async function tryFlee(){
  const p=ps();
  if(Math.random()<p.flee){logMsg('Kaçmayı başardın.');await tween(300,k=>BT.pl.ox=-90*k);endBattle('flee');}
  else{logMsg('Kaçamadın! Yolunu kestiler.');await wait(400);}
}
function useSkill(id){
  const k=SKILLS.find(s=>s.id===id);if(!k||BT.en<k.en)return;
  const pay=()=>{BT.en-=k.en;};
  if(id==='guclu')chooseTarget(t=>act(async()=>{pay();logMsg('Güçlü vuruş!');await playerStrike(t,1.7,{single:true});}));
  else if(id==='son')chooseTarget(t=>act(async()=>{pay();logMsg('Son darbe!');await playerStrike(t,3,{single:true});}));
  else if(id==='nisan')act(async()=>{pay();BT.focus=true;popPl('NİŞAN','#ff9f1c',13);logMsg('Nişan aldın. Sonraki saldırın kesin isabet ve kritik.');sfx('reload');await wait(400);});
  else if(id==='seri')act(async()=>{pay();logMsg('Seri saldırı!');for(let i=0;i<3;i++){const al=alive();if(!al.length)break;if(ps().w.mag&&BT.ammo<=0)break;await playerStrike(pick(al),.6,{single:true});}});
  else if(id==='savunma')act(async()=>{pay();BT.defend=true;const h=Math.round(ps().maxHp*.15);S.hp=Math.min(ps().maxHp,S.hp+h);popPl('+'+h,'#5fd38d',15);logMsg('Savunma duruşuna geçtin.');sfx('heal');await wait(400);});
  else if(id==='gozdagi')act(async()=>{pay();BT.weak=3;BT.shake=6;sfx('boss');logMsg('Gözdağı verdin! Düşmanlar çekindi.');for(const e of alive()){if(Math.random()<(e.boss?.15:.35)){e.stun=1;popOn(e,'SERSEMLEDİ','#62b6e0',12);}else popOn(e,'ÇEKİNDİ','#ffd27a',12);}await wait(500);});
}
function useItem(id){
  if(!(S.items[id]>0))return;const p=ps();
  if(id==='duman'&&BT.kind==='boss')return;
  act(async()=>{
    S.items[id]--;
    if(id==='enerji'){S.hp=Math.min(p.maxHp,S.hp+20);BT.en=Math.min(p.maxEn,BT.en+25);popPl('+20','#5fd38d',15);logMsg('Enerji içeceğini içtin.');sfx('heal');}
    else if(id==='ilkyardim'){const h=Math.round(p.maxHp*.6);S.hp=Math.min(p.maxHp,S.hp+h);popPl('+'+h,'#5fd38d',16);logMsg('İlk yardım çantasını kullandın.');sfx('heal');}
    else if(id==='biber'){logMsg('Biber gazı sıktın!');sfx('stun');for(const e of alive()){BT.fx.push({k:'cloud',x:e.x,y:enemyBodyY(e),life:.8});if(!e.boss||Math.random()<.5){e.stun=Math.max(e.stun,1);popOn(e,'SERSEMLEDİ','#62b6e0',12);}else popOn(e,'ETKİLENMEDİ','#b8bec6',12);}}
    else if(id==='adrenalin'){BT.adrenal=3;popPl('ADRENALİN','#ff4f8a',13);logMsg('Adrenalin! 3 tur boyunca daha sert vuruyorsun.');sfx('up');}
    else if(id==='duman'){logMsg('Duman bombası! Gözden kayboldun.');BT.fx.push({k:'cloud',x:PX,y:GROUND+20,life:1.2,big:1});await wait(500);endBattle('flee');}
    save();await wait(350);
  });
}
async function victory(){
  BT.over=true;sfx('win');await wait(500);
  const d=BT.d,m=BT.m;let bonus=0;
  if(BT.kind==='patrol'){BT.money=Math.round(BT.money*.8);BT.xp=Math.round(BT.xp*.8);}
  if(BT.kind!=='patrol'&&!isDone(d,m)){bonus=BT.kind==='boss'?0:firstBonus(d,m);S.done[d+'-'+m]=1;}
  else if(BT.kind!=='patrol'){BT.money=Math.round(BT.money*.6);BT.xp=Math.round(BT.xp*.6);}
  let unlocked=null,finished=false;
  if(BT.kind==='boss'){if(d+1>S.dist&&d+1<DIST.length){S.dist=d+1;unlocked=DIST[d+1].name;}if(d===DIST.length-1&&!S.finished){S.finished=true;finished=true;}}
  const total=BT.money+bonus;S.money+=total;S.wins++;
  let drop=null;if(Math.random()<.25){drop=pick(['enerji','enerji','ilkyardim','biber','adrenalin']);if((S.items[drop]||0)<MAXITEM)S.items[drop]=(S.items[drop]||0)+1;else drop=null;}
  const lv0=S.lv;gainXp(BT.xp);const lvUp=S.lv-lv0;
  save();
  const rows=`<div class="rows"><span>Düşmanlardan</span><b class="cash">+${tl(BT.money)}</b>${bonus?`<span>İlk zafer bonusu</span><b class="cash">+${tl(bonus)}</b>`:''}<span>Tecrübe</span><b style="color:var(--xp)">+${fmt(BT.xp)} XP</b>${drop?`<span>Bulunan eşya</span><b>${IMAP[drop].name}</b>`:''}<span>Cüzdan</span><b class="cash">${tl(S.money)}</b></div>`;
  const lvh=lvUp?`<div class="lvup">Seviye atladın! Artık seviye ${S.lv}. ${lvUp*3} yetenek puanın var, canın doldu.${SKILLS.filter(k=>k.lv>lv0&&k.lv<=S.lv).map(k=>`<br>Yeni hareket: ${k.name}`).join('')}</div>`:'';
  let head=`<h2 class="win">Kazandın!</h2>`;
  if(finished)head=`<h2 class="win">Şehir senin!</h2><p>Karahan devrildi, çetelerin ağı çöktü. Sokaklar artık güvende.</p>`;
  else if(BT.kind==='boss')head=`<h2 class="win">${DIST[d].boss.name} devrildi!</h2><p>${DIST[d].name} artık temiz.${unlocked?` Yeni bölge açıldı: <b style="color:var(--text)">${unlocked}</b>.`:''}</p>`;
  modal(head+rows+lvh,[{label:lvUp?'Şehre dön ve puanları dağıt':'Şehre dön',on:()=>{if(lvUp)tab='char';endBattle('win');}}]);
}
function gainXp(x){S.xp+=x;while(S.lv<LV_MAX&&S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;S.pts+=3;S.hp=ps().maxHp;sfx('lvl');}if(S.lv>=LV_MAX)S.xp=0;}
async function defeat(){
  BT.over=true;sfx('lose');await tween(500,k=>{BT.pl.alpha=1-k*.7;BT.pl.oy=k*4;});
  let stolen=0;for(const e of BT.enemies)if(e.stolen){stolen+=e.stolen;e.stolen=0;}
  const bill=Math.round(S.money*.15);S.money-=bill;S.hp=ps().maxHp;save();
  modal(`<h2 class="lose">Bayıldın</h2><p>Hastanede uyandın. Canın tamamen doldu ama fatura kesildi.</p><div class="rows"><span>Hastane faturası (%15)</span><b style="color:var(--hp)">−${tl(bill)}</b>${stolen?`<span>Çalınan para</span><b style="color:var(--hp)">−${tl(stolen)}</b>`:''}<span>Cüzdan</span><b class="cash">${tl(S.money)}</b></div><p>İpucu: Seviye atla, silahını modifiye et, zırh al. Ağır vuruşlardan önce Savunma Duruşu kullan.</p>`,
    [{label:'Şehre dön',on:()=>endBattle('lose')}]);
}
function endBattle(why){
  if(why==='flee'){let lost=0;for(const e of BT.enemies)if(!e.dead&&e.stolen){lost+=e.stolen;}if(lost)setTimeout(()=>modal(`<h2>Kaçtın</h2><p>Kapkaççı ${tl(lost)} ile birlikte kayboldu.</p>`,[{label:'Tamam',on:()=>{}}]),50);}
  BT=null;save();$('#battle').hidden=true;$('#hub').hidden=false;renderHub();
}

/* ---------------- SAVAŞ ÇİZİMİ ---------------- */
function drawChar(g,s,x,y,sc,flash,alpha){g.save();g.globalAlpha=alpha;g.drawImage(flash?s.white:s.img,Math.round(x-s.w*sc/2),Math.round(y-s.h*sc),s.w*sc,s.h*sc);g.restore();}
function shadow(g,x,y,r){g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,y,r,r*.3,0,0,Math.PI*2);g.fill();}
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(BT&&!$('#battle').hidden){try{drawBattle(dt);}catch(e){console.error(e);}}
  requestAnimationFrame(frame);
}
function drawBattle(dt){
  const g=g2;g.imageSmoothingEnabled=false;
  g.drawImage(getBg(BT.d),0,0);
  const p=ps();
  const items=[];
  const py=GROUND+38;
  items.push({y:py,f:()=>{
    const x=PX+BT.pl.ox,y=py+BT.pl.oy;const s=spr('hero','h_'+S.armor);
    const bob=Math.sin(now()*3)*.6;
    shadow(g,x,y,13);
    if(BT.pl.flash>0)BT.pl.flash-=dt;
    drawChar(g,s,x,y+bob,2,BT.pl.flash>0,BT.pl.alpha);
    if(p.w.id!=='yumruk'){const ws=spr(p.w.icon,p.w.pal);g.globalAlpha=BT.pl.alpha;g.drawImage(ws.img,Math.round(x+6),Math.round(y-15-ws.h/2+bob));g.globalAlpha=1;}
  }});
  for(const e of BT.enemies){
    if(e.gone)continue;
    items.push({y:e.y,f:()=>{
      e.t+=dt;if(e.flash>0)e.flash-=dt;
      if(e.dead){e.deadT+=dt;e.alpha=Math.max(0,1-e.deadT*2.2);if(e.alpha<=0){e.gone=true;return;}}
      const s=spr(e.art,e.pal);const x=e.x+e.ox,y=e.y+e.oy;
      const bob=e.dead?e.deadT*10:(e.art==='dog'?Math.abs(Math.sin(e.t*6))*-1:Math.sin(e.t*2.6)*.6);
      shadow(g,x,y,e.sc*(e.art==='heavy'?7:6));
      // düşmanlar sola bakar
      g.save();g.translate(x,0);g.scale(e.art==='dog'?1:-1,1);drawChar(g,s,0,y+bob,e.sc,e.flash>0||(e.charge&&Math.floor(e.t*10)%2===0),e.alpha);g.restore();
      if(e.wpn&&!e.dead){const ws=spr(e.wpn,e.wpn==='baton'?'w_baton':e.wpn==='knife'?'w_knife':e.wpn==='rifle'?'w_rifle':'w_gun');g.save();g.globalAlpha=e.alpha;g.translate(Math.round(x-e.sc*3),Math.round(y-e.sc*7.5-ws.h/2));g.scale(-1,1);g.drawImage(ws.img,0,0);g.restore();}
      if(e.stun>0&&!e.dead){const cx=x,cy=y-s.h*e.sc-4;for(let i=0;i<3;i++){const a=e.t*4+i*2.1;g.fillStyle='#ffe14a';g.fillRect(Math.round(cx+Math.cos(a)*8),Math.round(cy+Math.sin(a)*2),2,2);}}
    }});
  }
  items.sort((a,b)=>a.y-b.y);for(const it of items)it.f();
  // efektler
  for(const f of BT.fx){f.life-=dt;
    if(f.k==='tracer'){g.strokeStyle='rgba(255,230,150,.9)';g.lineWidth=1;g.beginPath();g.moveTo(f.x1,f.y1);g.lineTo(f.x2,f.y2);g.stroke();}
    else if(f.k==='flash'){g.fillStyle='#fff3b0';g.fillRect(f.x-3,f.y-3,6,6);g.fillStyle='#ff9f1c';g.fillRect(f.x-1,f.y-5,2,10);g.fillRect(f.x-5,f.y-1,10,2);}
    else if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=200*dt;g.fillStyle=f.col;g.fillRect(f.x|0,f.y|0,1,1);}
    else if(f.k==='cloud'){const k=1-f.life/(f.big?1.2:.8);g.fillStyle=`rgba(${f.big?'200,200,205':'255,140,60'},${.5*(1-k)})`;for(let i=0;i<6;i++){g.beginPath();g.arc(f.x+Math.cos(i)*10*(1+k),f.y+Math.sin(i*1.7)*6*(1+k),(f.big?14:8)*(0.6+k),0,Math.PI*2);g.fill();}}
  }
  BT.fx=BT.fx.filter(f=>f.life>0);
  // ekrana büyüt
  const c=bctx;c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;
  const sh=BT.shake>0?BT.shake:0;BT.shake=Math.max(0,BT.shake-dt*30);
  const ox=(Math.random()-.5)*sh*DPR,oy=(Math.random()-.5)*sh*DPR;
  c.fillStyle='#07080a';c.fillRect(0,0,bcv.width,bcv.height);
  c.drawImage(buf,ox,oy,bcv.width,bcv.height);
  const k=bScale*DPR;
  // düşman can çubukları + isimler
  c.textAlign='center';c.textBaseline='bottom';
  for(const e of BT.enemies){
    if(e.dead||e.gone)continue;const s=spr(e.art,e.pal);
    const x=(e.x+e.ox)*k,top=(e.y-s.h*e.sc-6)*k;const w=Math.max(46,e.sc*14)*k*.5;
    const sel=BT.menu==='target'&&!BT.busy;
    c.fillStyle='rgba(0,0,0,.7)';c.fillRect(x-w/2-2*DPR,top-2*DPR,w+4*DPR,7*DPR);
    c.fillStyle=e.boss?'#b45ad6':'#e5484d';c.fillRect(x-w/2,top,w*clamp(e.hp/e.max,0,1),3*DPR);
    c.font=`600 ${Math.round(11*DPR)}px "Barlow Semi Condensed",sans-serif`;c.fillStyle=e.boss?'#e8c8ff':'#ecebe6';c.fillText(e.name,x,top-4*DPR);
    if(sel){const ay=top-18*DPR+Math.sin(now()*8)*2*DPR;c.fillStyle='#ff9f1c';c.beginPath();c.moveTo(x-6*DPR,ay-8*DPR);c.lineTo(x+6*DPR,ay-8*DPR);c.lineTo(x,ay);c.fill();}
  }
  c.textBaseline='middle';
  for(const t of BT.texts){t.t+=dt;const a=t.t<.7?1:1-(t.t-.7)/.4;if(a<=0)continue;c.globalAlpha=a;c.font=`700 ${Math.round(t.size*DPR*clamp(bScale/2.4,.85,1.4))}px "Barlow Semi Condensed",sans-serif`;const y=(t.y-t.t*18)*k;c.lineWidth=4*DPR;c.strokeStyle='#000';c.strokeText(t.txt,t.x*k,y);c.fillStyle=t.col;c.fillText(t.txt,t.x*k,y);}
  c.globalAlpha=1;BT.texts=BT.texts.filter(t=>t.t<1.1);
}
const now=()=>performance.now()/1000;

/* ---------------- BAŞLAT ---------------- */
function boot(data){
  load();if(data&&data.S)S=Object.assign(fresh(),data.S);
  fixHp();bindReset();renderHub();
  requestAnimationFrame(t=>{lastT=t;frame(t);});
}
try{window.claude?.hot?.snapshot?.(()=>({S}));}catch(e){}
const hotApi=window.claude?.hot;
if(hotApi&&typeof hotApi.ready==='function')hotApi.ready(boot);else boot(hotApi?.data??{});
</script>
