<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İkinci Vitrin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Varsayılan açık pastel; üstteki ay/güneş düğmesi html[data-mode="dark"] ile karanlık moda geçirir. */
/* Layout: ikon ağırlıklı yumuşak telefon uygulaması — buzlu üst çubuk, 2 sütun görsel kartlar, yuvarlak alt menü */
:root{
  --bg:#f5f1f6; --surface:#ffffff; --sunk:#f0eaf2; --line:#e8e0ec; --fg:#3a3245; --muted:#857c90;
  --accent:#e07f97; --accent2:#c79ae0; --accent-fg:#ffffff; --brass:#c79a52; --good:#4f9f7a; --bad:#d66b78; --warn:#d48c45;
  --shadow:0 2px 6px rgba(110,80,140,.05),0 10px 28px rgba(110,80,140,.09);
  --f-body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  color-scheme:light;
}

html[data-mode="dark"]{
  --bg:#1e1a25; --surface:#2a2533; --sunk:#241f2c; --line:#3a3345; --fg:#f2ecf6; --muted:#ada3b9;
  --accent:#f29ab0; --accent2:#c9a4ef; --accent-fg:#2b1520; --brass:#e6c483; --good:#86d1aa; --bad:#f3a0aa; --warn:#f2bd85;
  --shadow:0 2px 8px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25); color-scheme:dark}
.mode{border:0;background:var(--sunk);border-radius:14px;width:42px;height:42px;display:grid;place-items:center;flex:none;color:var(--accent)}
.mode.float{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:7;background:var(--surface);box-shadow:var(--shadow)}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:700 15.5px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-weight:900}
.app{max-width:520px;margin:0 auto}
.good-c{color:var(--good)}.bad-c{color:var(--bad)}.warn-c{color:var(--warn)}.brass-c{color:var(--brass)}.muted,.muted-c{color:var(--muted)}
.grad{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg)}

/* ---------- Ana menü ---------- */
#menu{min-height:100%;display:grid;place-items:center;padding-block:40px}
.menu-box{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.logo{width:120px;height:120px;border-radius:38px;display:grid;place-items:center;box-shadow:0 16px 36px color-mix(in srgb,var(--accent) 35%,transparent)}
.wordmark{font-weight:900;font-size:clamp(40px,12vw,52px);line-height:1;margin:0;letter-spacing:-.02em}
.wordmark b{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.play{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:20px;border:0;border-radius:28px;font-size:22px;font-weight:900;
  box-shadow:0 12px 28px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s}
.play:hover{transform:translateY(-2px)}
.round-row{display:flex;gap:14px}
.rbtn{width:76px;height:76px;border-radius:24px;border:0;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--accent)}

/* ---------- Oyun iskeleti ---------- */
#game{padding-block:0 104px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--surface) 82%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(110,80,140,.07);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 16px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .app{display:flex;align-items:center;gap:6px}
.back{border:0;background:var(--sunk);border-radius:14px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.pill{display:flex;align-items:center;gap:5px;background:var(--sunk);border-radius:999px;padding:7px 10px;font-size:14.5px;white-space:nowrap;min-width:0}
.pill.day{margin-right:auto}
.pill.neg{color:var(--bad)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -6px 24px rgba(110,80,140,.1);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .app{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 1px 7px;font-size:10.5px;font-weight:800;color:var(--muted);position:relative;border-radius:18px}
.tabbar button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.dot{position:absolute;top:3px;left:calc(50% + 7px);min-width:19px;height:19px;border-radius:10px;font:900 11px/19px var(--f-body);padding:0 5px;box-sizing:border-box;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg)}

.screen{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.center{justify-content:center}
.sect{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:900;margin:4px 0 -6px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:26px}

/* görsel kartlar */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{position:relative;background:var(--surface);border:0;border-radius:26px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.art{border-radius:20px;display:grid;place-items:center;color:var(--fg);width:64px;height:64px;flex:none;
  background:linear-gradient(145deg,color-mix(in srgb,hsl(var(--h) 75% 72%) 42%,var(--surface)),color-mix(in srgb,hsl(calc(var(--h) + 40) 70% 80%) 22%,var(--surface)))}
.art svg{width:62%;height:62%}
.art.sm{width:38px;height:38px;border-radius:12px}
.tcard .art{width:100%;height:auto;aspect-ratio:1/1;max-width:100%}
.art.big{width:100%;height:180px;border-radius:32px}
.art.big svg{width:120px;height:120px}
.badges{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:6px}
.badges.left{right:auto;left:16px}
.bdg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.bdg.new{width:14px;height:14px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hero{position:relative}
.hero .badges{top:14px;right:14px}
.hero .bdg{width:44px;height:44px}
.price{font-size:18px}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brass)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--sunk);font-size:12.5px}
.tag.good{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:var(--warn)}

/* ikon butonları */
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.acts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.acts.two{grid-template-columns:1fr 1fr}
.ib{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;border-radius:22px;border:0;
  background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;font-weight:900;min-height:84px;transition:transform .12s}
.ib:hover:not(:disabled){transform:translateY(-2px)}
.ib:disabled{opacity:.4;cursor:not-allowed}
.ib.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg)}
.ib.good{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.ib.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--bad)}
.ib.flat{box-shadow:none;background:var(--sunk)}
.ib .lvl{display:flex;gap:2px;color:var(--brass)}
.ib .ok{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center}
.ib.done{opacity:.7}
.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent),var(--shadow)}60%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 0%,transparent),var(--shadow)}}

/* değer çubuğu */
.meter{height:14px;border-radius:7px;background:var(--sunk);position:relative;margin:6px 0}
.meter i{position:absolute;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--good),color-mix(in srgb,var(--good) 50%,var(--brass)))}
.meter em{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:var(--accent);margin-left:-3px}
.bigprice{font-size:34px;text-align:center;line-height:1.1}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:10px;align-items:center}
.stepper button{height:52px;border-radius:18px;border:0;background:var(--sunk);display:grid;place-items:center}

/* satıcı */
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-weight:900;font-size:18px;background:hsl(var(--h) 55% 62%);position:relative}
.avatar.sm{width:34px;height:34px;font-size:14px}
.avatar .crown{position:absolute;top:-12px;left:50%;transform:translateX(-50%);color:var(--brass)}
.hearts{display:flex;gap:2px;color:var(--accent)}
.hearts .off{color:var(--line)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{display:inline-flex;align-items:center;gap:8px;max-width:85%;padding:9px 13px;border-radius:20px;font-size:15px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:6px}
.msg.lie{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.qrow{display:flex;gap:10px;justify-content:flex-end}
.qb{width:58px;height:58px;border-radius:20px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent)}

/* ana sayfa */
.steps{display:flex;align-items:center;gap:6px}
.steps .st{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.steps .st.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg)}
.steps .ln{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps .ln.on{background:var(--accent2)}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:18px;background:var(--sunk);font-size:16px;min-width:0}
.trends{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px}
.trend{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.trend .art{width:50px;height:50px;border-radius:16px}
.call{display:grid;grid-template-columns:auto 56px minmax(0,1fr);gap:10px;align-items:center}
.call .art{width:56px;height:56px;border-radius:16px}
.call .acts{grid-column:1/-1}
.call .ib{min-height:62px}
.endday{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border:0;border-radius:26px;font-size:18px;font-weight:900;
  box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 32%,transparent)}
.revs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.rev{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.stars{display:flex;color:var(--brass)}
.stars .off{color:var(--line)}
.lot-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* pencere */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(50,35,70,.3);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:grid;place-items:end center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.overlay{place-items:center}}
.dialog{background:var(--surface);border-radius:32px;box-shadow:var(--shadow);width:100%;max-width:420px;max-height:calc(100% - 10px);overflow:auto;padding:22px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.dhead .big-ico{width:76px;height:76px;border-radius:26px;display:grid;place-items:center}
.dhead h2{margin:0;font-size:26px;font-weight:900}
.rep{display:flex;flex-direction:column;gap:8px}
.rep .r{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:18px;background:var(--sunk)}
.rep .r .ic{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:var(--surface);flex:none}
.rep .r .v{margin-left:auto;font-size:17px}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.flow div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:20px;background:var(--sunk);font-size:13px;position:relative}
.flow b{position:absolute;top:6px;left:9px;font-size:11px;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;font-size:12.5px}
.legend div{display:flex;flex-direction:column;align-items:center;gap:4px}
.bigbtn{width:100%;padding:16px;border:0;border-radius:22px;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn{flex-wrap:wrap}.bigbtn .num{white-space:nowrap}
.bigbtn:disabled{background:var(--sunk);color:var(--muted);cursor:not-allowed}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:20px;font-size:15px;font-weight:900;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
/* çalışanlar, hayat */
.staff{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px}
.ricon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--sunk);flex:none}
.ib.sm{min-height:72px;min-width:86px;padding:8px 6px}
.pbar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.good-bg{background:var(--good)}.warn-bg{background:var(--warn)}.bad-bg{background:var(--bad)}
.ricon.grad{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg)}
.next{display:flex;gap:10px;align-items:center;padding:10px;border-radius:18px;background:var(--sunk)}
.next .ib{box-shadow:none}
.lifelink{border:0;width:100%;text-align:left;display:flex;align-items:center;gap:12px}
/* lüks alışveriş */
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px}
.chipbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 14px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:14px}
.chipbtn:disabled{opacity:.5;cursor:not-allowed}
.chipbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg)}
.chipbtn .cnt{font-size:11px;font-weight:900;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:color-mix(in srgb,currentColor 18%,transparent);text-align:center;padding:0 4px}
.luxc{cursor:default}.luxc:hover{transform:none}
.luxart{position:relative;aspect-ratio:16/11;max-width:100%;border-radius:18px;display:grid;place-items:center;color:var(--fg);
  background:linear-gradient(145deg,color-mix(in srgb,hsl(var(--h) 70% 72%) 40%,var(--surface)),color-mix(in srgb,hsl(calc(var(--h) + 50) 70% 80%) 20%,var(--surface)))}
.luxart .ok{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center}
.luxname{font-size:14px;line-height:1.2;min-height:2.4em}
.btnbuy{border:0;border-radius:14px;padding:10px 6px;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--sunk);margin-top:auto}
.btnbuy:disabled{opacity:.5;cursor:not-allowed}
.btnbuy.owned{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
/* kısa etiketler */
.h1{font-size:24px;font-weight:900;margin:0;letter-spacing:-.01em}
.h1 small{display:block;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.sect{font-size:14px;color:var(--fg)}
.sect .sub{color:var(--muted);font-weight:700;font-size:13px}
.lbl{font-size:12.5px;font-weight:800;line-height:1.2;text-align:center}
.ib .num{font-size:12px;opacity:.85}
.stat small{font-size:11.5px;color:var(--muted);font-weight:800}
.tname{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.qrow{flex-wrap:wrap}
.qb{width:auto;height:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;font-weight:800;font-size:14px}
.rep .r .m{font-size:14px;min-width:0}
.tip{font-size:13.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<button class="mode float" data-act="mode" id="modeMenu"></button>
<section id="menu">
  <div class="menu-box">
    <div class="logo grad" id="logo"></div>
    <h1 class="wordmark">İkinci <b>Vitrin</b></h1>
    <p class="tip" style="margin:-14px 0 0">İkinci el lüks eşya al, pazarlık et, kârla sat.</p>
    <button class="play grad" data-act="play" id="playBtn"></button>
    <div class="round-row">
      <button class="rbtn" data-act="howto" aria-label="Nasıl oynanır" id="helpBtn"></button>
      <button class="rbtn" data-act="newask" aria-label="Yeni oyun" id="newBtn" hidden></button>
    </div>
  </div>
</section>

<section id="game" hidden>
  <header class="bar"><div class="app">
    <button class="back" data-act="back" id="backBtn"></button>
    <div class="pill day num" id="hDay"></div>
    <div class="pill num" id="hCash"></div>
    <div class="pill num" id="hRep"></div>
    <button class="mode" data-act="mode" id="modeBar"></button>
  </div></header>
  <main class="app" id="screen"></main>
  <nav class="tabbar"><div class="app" id="tabs"></div></nav>

  return v*lvl().pres*(.75+.005*S.rep);
}

function newItem(maxBase){
  const pool=ITEMS.map((x,i)=>i).filter(i=>ITEMS[i].base<=maxBase);
  const t=pick(pool), cat=ITEMS[t].cat, roll=Math.random();
  const cond=roll<.2?0:roll<.55?1:roll<.85?2:3;
  const opts=DEF.map((d,i)=>i).filter(i=>!DEF[i].c||DEF[i].c.includes(cat));
  const n=Math.random()<.45?0:Math.random()<.73?1:2, defects=[];
  while(defects.length<n){const d=pick(opts);if(!defects.includes(d))defects.push(d)}
  return {id:S.uid++,t,cond,fake:false,defects,kd:[],noise:R(.88,1.12),lup:false,serial:null,full:false,
          clean:false,photo:false,paid:0,listed:null,disclose:true,docs:false};
}
function genListings(){
  S.listings=[];
  const n=4+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const pi=Math.floor(Math.random()*PERSONAS.length), p=PERSONAS[pi], it=newItem(lvl().maxBase);
    it.fake=Math.random()<p.fake; it.docs=!it.fake&&Math.random()<.55;
    const ask=r100(mkt(it)*R(p.lo,p.hi)*(1-defSum(it.defects)*.3));
    S.listings.push({id:S.uid++,item:it,seller:pick(NAMES),persona:pi,ask,min:r100(ask*R(.72,.9)),
      patience:2+Math.floor(Math.random()*2),chat:[],claims:[],asked:[],leverage:false,used:false,seen:false});
  }
}
function genAuctions(){
  S.auctions=[];
  for(let i=0;i<2;i++){
    const it=newItem(lvl().maxBase*1.5); it.cond=Math.min(it.cond,1);
    if(!it.defects.length) it.defects.push(pick(DEF.map((d,i)=>i).filter(i=>!DEF[i].c||DEF[i].c.includes(T(it).cat))));
    it.lup=true; it.serial='temiz'; it.full=true;
    const start=r100(real(it)*.4);
    S.auctions.push({id:S.uid++,item:it,start,step:r100(Math.max(500,start*.06)),bid:start,leader:null,
      rivalMax:r100(mkt(it)*R(.42,.72)),rival:pick(RIVALS),done:false,won:false});
  }
}

function makeOffer(it){
  const r=Math.random(), type=S.level>=2&&r<.22?'vip':r<.45?'acil':'pazarlik', B=BUYERS[type];
  const amt=Math.min(it.listed,r100(buyerValue(it)*R(B.lo,B.hi)*(hasStaff('satisci')?1.05:1)));

    if(l.leverage&&!l.used) sel='[data-act=evidence]';

function eksHTML(it,ref){
  if(!hasStaff('eksper')||it.full) return '';
  if(it.eks) return `<div class="card row" style="padding:12px"><span class="ricon ${it.eks==='temiz'?'good-c':'warn-c'}">${ico('user',24)}</span>
    <div style="min-width:0"><b>Eksperin: ${it.eks==='temiz'?'“Orijinal görünüyor.”':'“Bu sahte olabilir!”'}</b><div class="muted" style="font-size:13px">%${Math.round(it.eksAcc*100)} emin. Kesin sonuç için uzman raporu al.</div></div></div>`;
  const left=eksLimit()-S.daily.eks;
  return `<button class="bigbtn" style="background:var(--surface);box-shadow:var(--shadow)" data-act="eks" data-ref="${ref}" ${left<=0?'disabled':''}>${ico('user',22)} Eksperine sor
    <span class="tag">%${Math.round(eksAcc()*100)} doğruluk</span><span class="tag ${left>0?'good':'bad'}">Bugün ${left}/${eksLimit()} hak</span></button>`;
}
function eksCheck(it){
  if(!hasStaff('eksper')||it.eks||it.full) return;
  if(S.daily.eks>=eksLimit()) return toast('user','Eksperin bugünlük yoruldu, yarın yine bakar','bad-c');
  const acc=eksAcc(), truth=it.fake?'supheli':'temiz';
  it.eks=Math.random()<acc?truth:(truth==='temiz'?'supheli':'temiz'); it.eksAcc=acc; S.daily.eks++;
  toast(it.eks==='temiz'?'check':'alert',it.eks==='temiz'?'Eksper: orijinal görünüyor':'Eksper: sahte olabilir!',it.eks==='temiz'?'good-c':'warn-c');
}
function testsHTML(it,ref){
  return [['lup','lup','Lup',it.lup],['seri','barcode','Seri no',!!it.serial],['uzman','cert','Uzman raporu',it.full]].map(([k,i,ad,done])=>
    done||it.full?`<div class="ib done">${ico(i,28)}<span class="lbl">${ad}</span><span class="ok">${ico('check',13,3)}</span></div>`
    :`<button class="ib" data-act="test" data-t="${k}" data-ref="${ref}" ${S.cash<testCost[k](it)?'disabled':''}>${ico(i,28)}<span class="lbl">${ad}</span><span class="num">${TL(testCost[k](it))}</span></button>`).join('');
}

/* ---- Çalışanlar ve hayat ---- */
function migrate(s){
  s.staff=s.staff||[];
  if(!s.owned){s.owned=[]; const L=s.life||{}, map={ev:[null,1,3,7,9],araba:[null,0,2,6,7],stil:[null,1,3,7]};
    for(const k in map){const t=L[k]||0; if(t>0&&map[k][t]!=null) s.owned.push(k+map[k][t])}}
  s.rel=s.rel||{aile:70,arkadas:60,sevgili:65}; s.daily=s.daily||{done:[],ads:0};
  s.eksLvl=s.eksLvl||1; s.daily.eks=s.daily.eks||0;
  return s;
}
const serialRoll=it=>it.fake?(Math.random()<.85?'supheli':'temiz'):(Math.random()<.95?'temiz':'supheli');
function applyStaff(){
  for(const it of S.inv){
    if(hasStaff('temizlikci')) it.clean=true;
    if(hasStaff('fotografci')) it.photo=true;
    if(hasStaff('tamirci')) it.lup=true;
  }
}
const bestIdx=k=>S.owned.filter(id=>id.startsWith(k)).reduce((m,id)=>Math.max(m,+id.slice(k.length)),-1);
const possH=()=>LUX.reduce((s,c)=>{const b=bestIdx(c.k); if(b<0) return s; const n=S.owned.filter(id=>id.startsWith(c.k)).length; return s+c.items[b].h+Math.min(5,n-1)},0);
const relAvg=()=>RELS.reduce((s,r)=>s+S.rel[r.k],0)/RELS.length;
const happy=()=>clamp(Math.round(15+possH()+relAvg()*.3),0,100);
const moodOf=h=>h>=65?['happy','good']:h>=35?['meh','warn']:['sad','bad'];

let adBusy=false;
function runAd(k){
  if(S.daily.ads>=3||adBusy) return;
  let n=5; adBusy=true; $('#overlay').hidden=false;
  const draw=()=>{$('#dialog').innerHTML=`<div class="dhead"><div class="big-ico" style="background:var(--sunk)">${ico('tv',40)}</div><h2>Reklam</h2>
    <p class="tip" style="margin:0">Örnek reklam alanı · ${n} sn</p></div><div class="pbar"><i class="good-bg" style="width:${(5-n)/5*100}%"></i></div>`};
  draw();
  const t=setInterval(()=>{n--; if(n>0) return draw(); clearInterval(t); adBusy=false;
    S.daily.ads++; S.rel[k]=clamp(S.rel[k]+10,0,100); save(); render();
    const r=RELS.find(x=>x.k===k);
    openDlg(`<div class="dhead"><div class="big-ico grad">${ico(r.ic,40)}</div><h2>${r.ad} +10</h2></div><button class="bigbtn grad" data-act="close">${ico('check',22,2.6)} Tamam</button>`)},1000);
}

function bindInputs(){
  const rg=$('#offerRange'); if(rg){const b=+rg.dataset.base;rg.oninput=()=>$('#offerShow').textContent=TL(r100(b*rg.value/100))}
  const pr=$('#priceRange'); if(pr){const b=+pr.dataset.base;pr.oninput=()=>$('#priceShow').textContent=TL(r100(b*pr.value/100))}
}
const curOffer=()=>{const rg=$('#offerRange');return r100(+rg.dataset.base*rg.value/100)};
const curPrice=()=>{const pr=$('#priceRange');return r100(+pr.dataset.base*pr.value/100)};
let toastT;
function toast(ic,txt,cls=''){const t=$('#toast');t.onclick=null;t.style.cursor='';t.innerHTML=`<span class="${cls}">${ico(ic,20,2.4)}</span>${txt?`<span>${esc(txt)}</span>`:''}`;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
function openDlg(html){$('#dialog').innerHTML=html;$('#overlay').hidden=false;const f=$('#dialog').querySelector('button');f&&f.focus()}
function closeDlg(){$('#overlay').hidden=true}
const say=(l,m)=>l.chat.push(m);
const NOCASH=()=>toast('coins','Kasada yeterli para yok','bad-c');

function ask(l,q){
  const it=l.item,P=PERSONAS[l.persona]; l.asked.push(q);
  if(q==='belge'){say(l,{me:1,ic:'doc',t:'Belgesi var mı?'});
    if(it.docs){l.claims.push({k:'belge'});say(l,{ok:true,t:'Kutusu, faturası tam.',claim:l.claims.length-1})}
    else if(it.fake){l.claims.push({k:'belge',lie:true});say(l,{ok:true,t:'Var var, evde duruyor.',claim:l.claims.length-1})}
    else say(l,{ok:false,t:'Maalesef belgesi yok.'})}
  if(q==='kusur'){say(l,{me:1,ic:'crack',t:'Kusuru var mı?'});
    if(!it.defects.length){l.claims.push({k:'kusur'});say(l,{ok:true,t:'Hiç kusuru yok.',claim:l.claims.length-1})}
    else if(Math.random()<P.honest){const d=it.defects[0];it.kd.push(d);say(l,{ic:'crack',t:`Saklamayayım: ${DEF[d].ad.toLowerCase()} var.`})}
    else {l.claims.push({k:'kusur',lie:true});say(l,{ok:true,t:'Sıfır gibi, kusursuz.',claim:l.claims.length-1})}}
  checkLeverage(l);
}
function checkLeverage(l){if(!l.leverage&&l.claims.some(c=>caught(l,c))){l.leverage=true;toast('alert','Satıcının yalanını yakaladın!','bad-c')}}
function runTest(it,k,l){
  const c=testCost[k](it); if(S.cash<c) return NOCASH();
  S.cash-=c;
  if(k==='lup'){it.lup=true;toast('crack',it.defects.length?`${it.defects.length} kusur bulundu`:'Kusur yok',it.defects.length?'warn-c':'good-c')}
  if(k==='seri'){it.serial=it.fake?(Math.random()<.85?'supheli':'temiz'):(Math.random()<.95?'temiz':'supheli');toast(it.serial==='temiz'?'check':'alert',it.serial==='temiz'?'Kayıt temiz':'Kayıt şüpheli!',it.serial==='temiz'?'good-c':'warn-c')}
  if(k==='uzman'){it.full=true;it.lup=true;it.serial=it.fake?'supheli':'temiz';toast(it.fake?'x':'check',it.fake?'Sahte çıktı!':`Orijinal · ${TL(real(it))}`,it.fake?'bad-c':'good-c')}
  if(l) checkLeverage(l);
  save(); render();
}
function buyListing(l,price){
  if(S.inv.length>=lvl().cap) return toast('box','Stok dolu, önce sat','bad-c');
  if(S.cash<price) return NOCASH();
  S.cash-=price; l.item.paid=price; l.item.disclose=true; S.inv.push(l.item); S.stats.bought++;
  S.listings=S.listings.filter(x=>x!==l); save(); go('stok',l.item.id); toast('cart',`${TL(price)}'ye aldın`,'good-c');
}
function offer(l){
  const v=curOffer();
  if(v>S.cash) return NOCASH();
  if(v>=l.ask) return buyListing(l,l.ask);
  say(l,{me:1,ic:'hand',t:`${TL(v)} veririm.`});
  if(v>=l.min){say(l,{ok:true,t:'Tamam, anlaştık!'});return buyListing(l,v)}
  l.patience-= v<l.min*.65?2:1;
  if(l.patience<=0){S.listings=S.listings.filter(x=>x!==l);save();go('ilan');return toast('sad','Satıcı kızdı ve gitti','bad-c')}
  l.ask=r100(Math.max(l.min,(l.ask+l.min)/2));
  say(l,{ic:'undo',t:`Olmaz. ${TL(l.ask)} olur.`}); save(); render();
}
function evidence(l){
  l.used=true; say(l,{me:1,ic:'alert',t:'Yalan söylediniz, ortada!'});
  l.min=r100(l.min*.85); l.ask=r100(Math.max(l.min,l.ask*.85)); l.patience=Math.max(l.patience,2);
  say(l,{ic:'down',t:`Peki... ${TL(l.ask)} olsun.`}); save(); render();
}
function walk(l){
  say(l,{me:1,ic:'door',t:'Kolay gelsin.'});
  if(Math.random()<.45&&l.ask>l.min){l.ask=r100(Math.max(l.min,l.ask*.9));say(l,{ic:'phone',t:`Dur dur! ${TL(l.ask)} olsun.`});save();render();return toast('phone','Satıcı geri aradı!','good-c')}
  S.listings=S.listings.filter(x=>x!==l); save(); go('ilan');
}
function bid(a){
  const price=a.leader?a.bid+a.step:a.bid;
  if(S.cash<price*1.05) return NOCASH();
  if(S.inv.length>=lvl().cap) return toast('box','Stok dolu','bad-c');
  a.bid=price; a.leader='Sen';
  if(price+a.step<=a.rivalMax){a.bid=price+a.step;a.leader=Math.random()<.7?a.rival:pick(RIVALS)}
  save(); render();
}
function hammer(a){
  if(a.leader!=='Sen') return;
  a.done=true; a.won=true; const cost=r100(a.bid*1.05);
  S.cash-=cost; a.item.paid=cost; S.inv.push(a.item); S.stats.bought++; save(); render(); toast('hammer',`Senin oldu · ${TL(cost)}`,'good-c');
}
function fold(a){a.done=true;a.won=false;if(a.leader==='Sen'||!a.leader)a.leader=a.rival;save();render()}
function fix(it,k){
  const kd=knownDefs(it), cost=fixCosts(it)[k];
  if(cost==null) return; if(S.cash<cost) return NOCASH();
  S.cash-=cost;
  if(k==='ucuz'){const fixed=kd.filter(()=>Math.random()<.6);it.defects=it.defects.filter(d=>!fixed.includes(d));toast('wrench',fixed.length===kd.length?'Hepsi düzeldi':`${kd.length-fixed.length} kusur düzelmedi`,fixed.length===kd.length?'good-c':'warn-c')}
  if(k==='standart'){it.defects=it.defects.filter(d=>!kd.includes(d));toast('wrench','Kusurlar giderildi','good-c')}
  if(k==='premium'){it.defects=[];it.cond=Math.min(3,it.cond+1);toast('sparkle',`Usta işi! ${KOND[it.cond].ad}`,'good-c')}
  it.kd=it.kd.filter(d=>it.defects.includes(d)); save(); render();
}
function sell(it,price){
  S.inv=S.inv.filter(x=>x!==it); S.offers=S.offers.filter(o=>o.itemId!==it.id);
  S.cash+=price; S.stats.sold++; const p=price-it.paid; S.stats.profit+=p;
  const hidden=it.defects.filter(d=>!(it.disclose&&knownDefs(it).includes(d)));
  S.pending.push({cat:T(it).cat,price,fake:it.fake&&!it.full,hidden:hidden.map(d=>r100(T(it).base*KOND[it.cond].k*DEF[d].p*.8)),
    disclosed:it.disclose&&knownDefs(it).length>0,cert:it.full&&!it.fake,buyer:pick(NAMES)});
  return p;
}
function review(s,n){S.reviews.unshift({s,n});S.reviews=S.reviews.slice(0,12)}

/* ================= GÜN SONU ================= */
function endDay(){
  const rep=[]; // {ic, m, v|txt, c, cat}
  for(const s of S.pending){
    if(s.fake&&Math.random()<.65){S.cash-=s.price;S.rep=clamp(S.rep-15,0,100);review(1,s.buyer);rep.push({ic:'shieldx',cat:s.cat,m:'Sahte çıktı, iade edildi',v:-s.price,c:'bad'});continue}
    let comp=0; for(const h of s.hidden) if(Math.random()<.5) comp+=h;
    if(comp){S.cash-=comp;S.rep=clamp(S.rep-6,0,100);review(2,s.buyer);rep.push({ic:'crack',cat:s.cat,m:'Gizli kusur tazminatı',v:-comp,c:'bad'});continue}
    const up=1+(s.disclosed?1:0)+(s.cert?1:0); S.rep=clamp(S.rep+up,0,100); review(s.cert||s.disclosed?5:4,s.buyer);
    rep.push({ic:'star',cat:s.cat,m:'Mutlu müşteri, itibar',txt:'+'+up,c:'brass'});
  }
  S.pending=[]; S.offers=[];
  S.cash-=lvl().rent; rep.push({ic:'home',m:'Kira',v:-lvl().rent,c:'bad'});
  if(S.debt>0){const f=r100(S.debt*.01);S.debt+=f;rep.push({ic:'percent',m:'Kredi faizi',v:-f,c:'bad'})}
  const wages=S.staff.reduce((s,id)=>s+wageOf(id),0);
  if(wages){S.cash-=wages;rep.push({ic:'friends',m:'Çalışan maaşları',v:-wages,c:'bad'})}
  for(const r of RELS){S.rel[r.k]=clamp(S.rel[r.k]-R(3,6),0,100); if(S.rel[r.k]<30) rep.push({ic:r.ic,m:r.warn,c:'bad'})}
  const hp=happy();
  if(hp>=70){S.rep=clamp(S.rep+1,0,100);rep.push({ic:'happy',m:'Mutlusun, itibarın arttı',txt:'+1',c:'good'})}
  else if(hp<30){S.rep=clamp(S.rep-1,0,100);rep.push({ic:'sad',m:'Mutsuzsun, itibarın düştü',txt:'−1',c:'bad'})}
  S.daily={done:[],ads:0,eks:0};
  const oldSeason=season();
  S.day++;
  for(const c in CATS) S.trend[c]=clamp(S.trend[c]*R(.95,1.05)+(1-S.trend[c])*.08,.6,1.6);
  const c=pick(Object.keys(CATS)), up=Math.random()<.55;
  S.trend[c]=clamp(S.trend[c]*(up?R(1.15,1.3):R(.75,.87)),.6,1.6);
  rep.push({ic:up?'up':'down',cat:c,m:`${CATS[c][0]} talebi ${up?'arttı':'düştü'}`,c:up?'good':'bad'});
  if(season()!==oldSeason) rep.push({ic:season().ic,m:`${season().ad} geldi`,c:'brass'});
  if(S.cash<0&&S.debt-S.cash<=loanLimit()){const need=r100(-S.cash);S.debt+=need;S.cash+=need;rep.push({ic:'bank',m:'Kasa eksideydi, otomatik kredi',v:need,c:'warn'})}
  genListings(); genAuctions(); save(); view={tab:'home',id:null}; render(); scrollTo(0,0);
  openDlg(`<div class="dhead"><div class="big-ico grad">${ico('sunrise',40)}</div><h2>${S.day}. gün başladı</h2></div>
    <div class="rep">${rep.map(r=>`<div class="r"><span class="ic ${r.c}-c">${r.ic==='shieldx'?shieldIco('x',22):ico(r.ic,22,2.4)}</span>${r.cat?artC(r.cat,'sm'):''}
      <span class="m">${esc(r.m)}</span><span class="v num ${r.c}-c">${r.v!=null?sTL(r.v):r.txt||''}</span></div>`).join('')}</div>
    <button class="bigbtn grad" data-act="close">${ico('play',20)} Dükkânı aç</button>`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  learn(b);
  const act=b.dataset.act, id=+b.dataset.id;
  const L=()=>S.listings.find(x=>x.id===id), I=()=>S.inv.find(x=>x.id===id), A=()=>S.auctions.find(x=>x.id===id);
  switch(act){
    case 'play': {const s=load(); if(s){S=migrate(s);view={tab:'home',id:null};showGame()} else {newGame();howto()} break}
    case 'newask': openDlg(`<div class="dhead"><div class="big-ico grad">${ico('plus',40)}</div><h2>Yeni oyun?</h2><p class="tip" style="margin:0">Kayıtlı oyunun silinir.</p></div>
      <div class="acts two"><button class="ib flat" data-act="close">${ico('x',26,2.6)}<span class="lbl">Vazgeç</span></button><button class="ib primary" data-act="new">${ico('check',26,2.6)}<span class="lbl">Baştan başla</span></button></div>`); break;
    case 'new': closeDlg(); newGame(); break;
    case 'howto': howto(); break;
    case 'close': closeDlg(); break;
    case 'back': if(view.id) go(view.tab); else {save();showMenu()} break;
    case 'tab': go(b.dataset.tab); break;
    case 'openL': go('ilan',id); break;
    case 'openI': go('stok',id); break;
    case 'ask': {const l=L(); if(l){ask(l,b.dataset.q);save();render()} break}
    case 'test': {const r=b.dataset.ref, n=+r.slice(1); if(r[0]==='L'){const l=S.listings.find(x=>x.id===n); l&&runTest(l.item,b.dataset.t,l)} else {const it=S.inv.find(x=>x.id===n); it&&runTest(it,b.dataset.t)} break}
    case 'offer': {const l=L(); l&&offer(l); break}
    case 'buyL': {const l=L(); l&&buyListing(l,l.ask); break}
    case 'evidence': {const l=L(); l&&evidence(l); break}
    case 'walk': {const l=L(); l&&walk(l); break}
    case 'bid': {const a=A(); a&&bid(a); break}
    case 'hammer': {const a=A(); a&&hammer(a); break}
    case 'fold': {const a=A(); a&&fold(a); break}
    case 'fix': {const it=I(); it&&fix(it,b.dataset.k); break}
    case 'clean': {const it=I(); if(it){S.cash-=cleanCost(it);it.clean=true;save();render();toast('sparkle','Pırıl pırıl oldu','good-c')} break}
    case 'photo': {const it=I(); if(it){S.cash-=PHOTO;it.photo=true;save();render();toast('camera','Profesyonel fotoğraflar hazır','good-c')} break}
    case 'disc': {const it=I(); if(it){it.disclose=!it.disclose;save();render()} break}
    case 'pstep': {const pr=$('#priceRange'); pr.value=clamp(+pr.value+5*+b.dataset.v,50,170); pr.oninput(); break}
    case 'list': {const it=I(); if(it){const v=curPrice(); it.listed=v; S.offers=S.offers.filter(o=>o.itemId!==it.id); save(); render(); toast('tag',`İlanda: ${TL(v)}`,'brass-c')} break}
    case 'unlist': {const it=I(); if(it){it.listed=null;S.offers=S.offers.filter(o=>o.itemId!==it.id);save();render()} break}
    case 'accept': {const o=S.offers.find(x=>x.id===id), it=o&&S.inv.find(x=>x.id===o.itemId);
      if(it){const p=sell(it,o.amount);save();render();toast(p>=0?'up':'down',`Satıldı! ${p>=0?'Kâr':'Zarar'} ${TL(Math.abs(p))}`,p>=0?'good-c':'bad-c')} break}
    case 'counter': {const o=S.offers.find(x=>x.id===id), it=o&&S.inv.find(x=>x.id===o.itemId); if(!it)break;
      if(Math.random()<BUYERS[o.type].acc){o.amount=it.listed;o.countered=true;toast('check',`${o.buyer} kabul etti`,'good-c')}
      else {S.offers=S.offers.filter(x=>x!==o);toast('x',`${o.buyer} vazgeçti`,'bad-c')} save(); render(); break}
    case 'reject': S.offers=S.offers.filter(x=>x.id!==id); save(); render(); break;
    case 'upgrade': {const n=LEVELS[S.level+1]; if(n&&S.cash>=n.price){S.cash-=n.price;S.level++;genListings();save();render();
      openDlg(`<div class="dhead"><div class="big-ico grad">${ico(n.ic,44)}</div><h2>${n.ad} açıldı!</h2></div>
        <div class="stat3" style="margin:0"><div class="stat good-c">${ico('box',22)}<span class="num">${n.cap}</span><small>Stok yeri</small></div>
        <div class="stat good-c">${ico('gem',22)}<small>Daha değerli ilanlar</small></div><div class="stat bad-c">${ico('home',22)}<span class="num">−${FMT.format(n.rent)}</span><small>Günlük kira</small></div></div>
        <button class="bigbtn grad" data-act="close">${ico('check',22,2.6)} Harika</button>`)} break}
    case 'borrow': {const v=+b.dataset.v; if(S.debt+v<=loanLimit()){S.debt+=v;S.cash+=v;save();render();toast('coins',`${TL(v)} kredi kasada`,'good-c')} break}
    case 'repay': {const v=b.dataset.v==='all'?Math.min(S.debt,S.cash):Math.min(10000,S.debt,S.cash); if(v>0){S.debt-=v;S.cash-=v;save();render();toast('check',`${TL(v)} borç ödendi`,'good-c')} break}
    case 'hire': {const st=STAFF.find(x=>x.id===b.dataset.s); if(st&&S.cash>=st.hire&&S.level>=st.lvl&&!hasStaff(st.id)){S.cash-=st.hire;S.staff.push(st.id);save();render();toast(st.ic,`${st.ad} işe başladı`,'good-c')} break}
    case 'fire': {const st=STAFF.find(x=>x.id===b.dataset.s); S.staff=S.staff.filter(x=>x!==b.dataset.s); save(); render(); st&&toast('x',`${st.ad} işten ayrıldı`); break}
    case 'eks': {const r=b.dataset.ref, n=+r.slice(1);
      if(r[0]==='L'){const l=S.listings.find(x=>x.id===n); if(l){eksCheck(l.item); checkLeverage(l)}} else {const it=S.inv.find(x=>x.id===n); it&&eksCheck(it)}
      save(); render(); break}
    case 'eksup': {const nx=EKS[S.eksLvl]; if(!nx)break; if(S.cash<nx.cost){NOCASH();break}
      S.cash-=nx.cost; S.eksLvl++; save(); render(); toast('up',`Eksper seviye ${S.eksLvl}: %${Math.round(nx.acc*100)} doğruluk`,'good-c'); break}
    case 'luxcat': luxCat=b.dataset.k; render(); break;
    case 'lux': {const id=b.dataset.lux, c=LUX.find(x=>id.startsWith(x.k)&&/^\d+$/.test(id.slice(x.k.length))), it=c&&c.items.find(x=>x.id===id);
      if(!it||S.owned.includes(id)||S.level<it.lvl) break; if(S.cash<it.p){NOCASH();break}
      const before=happy(); S.cash-=it.p; S.owned.push(id); S.rep=clamp(S.rep+it.r,0,100); save(); render();
      openDlg(`<div class="dhead"><div class="big-ico grad">${ico(c.ic,44)}</div><h2>${it.ad} senin!</h2></div>
        <div class="stat3" style="margin:0;grid-template-columns:1fr 1fr"><div class="stat good-c">${ico('happy',24)}<span class="num">${before} → ${happy()}</span><small>Mutluluk</small></div>
        <div class="stat brass-c">${icoF('star',22)}<span class="num">+${it.r}</span><small>İtibar</small></div></div>
        <button class="bigbtn grad" data-act="close">${ico('check',22,2.6)} Harika</button>`); break}
    case 'rel': {const r=RELS.find(x=>x.k===b.dataset.r), i=+b.dataset.i, a=r&&r.acts[i], key=b.dataset.r+':'+i;
      if(!a||S.daily.done.includes(key))break; if(S.cash<a.cost){NOCASH();break}
      S.cash-=a.cost; S.rel[r.k]=clamp(S.rel[r.k]+a.g,0,100); S.daily.done.push(key); save(); render(); toast(r.ic,`${r.ad} +${a.g}`,'good-c'); break}
    case 'ad': if(S.daily.ads<3) openDlg(`<div class="dhead"><div class="big-ico grad">${ico('tv',40)}</div><h2>Kimin için?</h2><p class="tip" style="margin:0">Reklamı izle, seçtiğin ilişki +10 artsın.</p></div>
      <div class="acts">${RELS.map(r=>`<button class="ib" data-act="adgo" data-r="${r.k}">${ico(r.ic,26)}<span class="lbl">${r.ad}</span><span class="num">${Math.round(S.rel[r.k])}</span></button>`).join('')}</div>
      <button class="bigbtn" style="background:var(--sunk)" data-act="close">Vazgeç</button>`); break;
    case 'adgo': runAd(b.dataset.r); break;
    case 'mode': setMode(document.documentElement.dataset.mode==='dark'?'light':'dark'); break;
    case 'endday': endDay(); break;
  }
});
