<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İkinci Vitrin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: yumuşak telefon uygulaması — buzlu üst çubuk, pastel kartlar, yuvarlak alt menü */
:root{
  --bg:#f5f1f6; --surface:#ffffff; --sunk:#f0eaf2; --line:#e8e0ec; --fg:#3a3245; --muted:#857c90;
  --accent:#e07f97; --accent2:#c79ae0; --accent-fg:#ffffff; --brass:#c79a52; --good:#4f9f7a; --bad:#d66b78; --warn:#d48c45;
  --shadow:0 2px 6px rgba(110,80,140,.05),0 10px 28px rgba(110,80,140,.09);
  --f-display:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-num:"Nunito",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e1a25; --surface:#2a2533; --sunk:#241f2c; --line:#3a3345; --fg:#f2ecf6; --muted:#ada3b9;
  --accent:#f29ab0; --accent2:#c9a4ef; --accent-fg:#2b1520; --brass:#e6c483; --good:#86d1aa; --bad:#f3a0aa; --warn:#f2bd85;
  --shadow:0 2px 8px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1a25; --surface:#2a2533; --sunk:#241f2c; --line:#3a3345; --fg:#f2ecf6; --muted:#ada3b9;
  --accent:#f29ab0; --accent2:#c9a4ef; --accent-fg:#2b1520; --brass:#e6c483; --good:#86d1aa; --bad:#f3a0aa; --warn:#f2bd85;
  --shadow:0 2px 8px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto}
h1,h2,h3{text-wrap:balance}

/* ---------- Ana menü ---------- */
#menu{min-height:100%;display:grid;place-items:center;padding-block:40px}
.menu-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:26px}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
.tag::before{content:"";width:9px;height:9px;border:1.5px solid currentColor;border-radius:50%}
.wordmark{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(48px,14vw,66px);line-height:.95;margin:10px 0 12px}
.wordmark b{font-style:normal;font-weight:700;display:block;color:var(--accent)}
.menu-sub{color:var(--muted);margin:0;max-width:32ch}
.menu-btns{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);font-weight:700;font-size:17px;text-align:left;transition:transform .12s,border-color .12s}
.mbtn:hover{border-color:var(--fg);transform:translateY(-1px)}
.mbtn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mbtn small{font-weight:500;opacity:.8;font-size:13px}

/* ---------- Oyun iskeleti ---------- */
#game{padding-block:0 96px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .app{display:flex;align-items:center;gap:10px}
.bar .back{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.bar .when{flex:1;min-width:0}
.bar .when b{display:block;font-size:15px}
.bar .when span{font-size:12px;color:var(--muted)}
.pill{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:14px;white-space:nowrap}
.pill.neg{color:var(--bad)}
.pill svg{flex:none}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .app{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative;border-radius:10px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font:600 11px/17px var(--f-num);padding:0 4px;box-sizing:border-box}

.screen{display:flex;flex-direction:column;gap:14px}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.h h2{font-family:var(--f-display);font-weight:500;font-size:26px;margin:0;line-height:1.1}
.h small{color:var(--muted);font-size:13px}
.sect{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 -4px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}

/* ilan / ürün satırı */
.row-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:10px;text-align:left;width:100%;transition:border-color .12s}
button.row-card:hover{border-color:var(--fg)}
.art{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;color:var(--fg);
  background:color-mix(in srgb,hsl(var(--h) 55% 50%) 16%,var(--surface));border:1px solid color-mix(in srgb,hsl(var(--h) 55% 45%) 25%,var(--line))}
.art.big{width:100%;height:150px;border-radius:14px}
.art.big svg{width:110px;height:110px}
.rc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rc-name{font-weight:700;line-height:1.25;min-width:0}
.rc-price{font-size:15px;white-space:nowrap}
.rc-sub{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.brass{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,transparent)}
.chip.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* detay */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 auto}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt b{font-size:14.5px}
.opt small{grid-column:1;color:var(--muted);font-size:12.5px}
.opt .btn{grid-row:span 2;grid-column:2;padding:8px 12px;font-size:13px;white-space:nowrap}
.done{font-size:13px;font-weight:700;color:var(--good);grid-row:span 2;grid-column:2}

/* konuşma */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.qs{display:flex;flex-wrap:wrap;gap:6px}
.qs .btn{padding:7px 11px;font-size:13px;border-radius:20px}
.claim{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--sunk)}
.claim.caught{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad);font-weight:600}
.range{font-size:20px}
.meter{height:6px;border-radius:3px;background:var(--sunk);position:relative;margin-top:8px}
.meter i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--brass)}
.meter em{position:absolute;top:-4px;width:2px;height:14px;background:var(--accent)}

input[type=number]{font:500 20px var(--f-num);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px;border-radius:10px;background:var(--sunk)}
.check input{width:18px;height:18px;accent-color:var(--accent);margin-top:1px}

/* ana sayfa */
.shop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.shop .lvl{width:66px;height:66px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.shop h3{margin:0;font-family:var(--f-display);font-size:24px;font-weight:500}
.stars{color:var(--brass);letter-spacing:1px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile:hover{border-color:var(--fg)}
.tile b{font-size:16px}
.tile small{color:var(--muted);font-size:12.5px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.paper .mast{font-family:var(--f-display);font-style:italic;font-size:22px;border-bottom:2px solid var(--fg);padding-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.paper .mast small{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--muted)}
.paper ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.paper li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.paper li:last-child{border-bottom:0}
.call{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.call .who{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.review{font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.endday{width:100%;padding:16px;border-radius:14px;border:0;background:var(--fg);color:var(--bg);font-weight:800;font-size:16px}

/* mezat */
.lot-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bid{font-size:28px;line-height:1}
.leader{font-size:13px;font-weight:700}
.leader.me{color:var(--good)}.leader.them{color:var(--bad)}

/* pencere */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.55);display:grid;place-items:end center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.overlay{place-items:center}}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:440px;max-height:calc(100% - 10px);overflow:auto;padding:20px;box-sizing:border-box}
.dialog h2{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.15;margin:0 0 4px}
.dialog .lead{color:var(--muted);margin:0 0 12px;font-size:14px}
.report{list-style:none;padding:0;margin:8px 0 14px;display:flex;flex-direction:column;gap:6px}
.report li{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--sunk);border-left:3px solid var(--line)}
.report li.good{border-color:var(--good)}.report li.bad{border-color:var(--bad)}.report li.brass{border-color:var(--brass)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
.howto ol{padding-left:20px;margin:6px 0 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
/* ---------- yumuşak görünüm ---------- */
body{font-size:15.5px}
.num{letter-spacing:0;font-weight:800}
.wordmark{font-style:normal;font-weight:900;letter-spacing:-.02em}
.wordmark b{font-weight:900;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.h h2,.dialog h2,.shop h3{font-weight:900;letter-spacing:-.01em}
.box,.paper,.row-card,.tile,.call,.mbtn{border-color:transparent;box-shadow:var(--shadow);border-radius:24px}
.empty{border-radius:24px;border-color:var(--line);background:color-mix(in srgb,var(--surface) 50%,transparent)}
.mbtn.primary,.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn{border-radius:16px;border-color:var(--line)}
.btn.ok{border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--good) 25%,transparent)}
.btn.dark{background:var(--sunk);color:var(--fg);border-color:var(--accent)}
.qs .btn,.chip,.pill{border-radius:999px}
.chip{background:var(--sunk);border-color:transparent}
.chip.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:transparent}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:transparent}
.chip.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:transparent}
.chip.brass{background:color-mix(in srgb,var(--brass) 16%,var(--surface));border-color:transparent}
.art{border:0;border-radius:20px;background:linear-gradient(145deg,color-mix(in srgb,hsl(var(--h) 75% 72%) 42%,var(--surface)),color-mix(in srgb,hsl(calc(var(--h) + 40) 70% 80%) 22%,var(--surface)))}
.art.big{border-radius:30px;height:170px}
.bar{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:0;box-shadow:0 4px 18px rgba(110,80,140,.07)}
body::before{background:color-mix(in srgb,var(--surface) 80%,transparent)}
.bar .back{border:0;background:var(--sunk);border-radius:14px}
.pill{border:0;background:var(--sunk);font-weight:800}
.tabbar{border-top:0;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(110,80,140,.1)}
.tabbar button{border-radius:16px;padding-block:8px}
.tabbar button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.tabbar .dot{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.shop .lvl{border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.paper .mast{font-family:var(--f-display);font-style:normal;font-weight:900;border-bottom:0;padding-bottom:2px}
.paper li,.kv,.opt,.review{border-bottom-color:var(--sunk)}
.paper li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent2);margin-right:9px;vertical-align:middle}
.endday{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg);border-radius:22px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 32%,transparent)}
.msg{border-radius:20px}
.msg.me{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.claim,.check{border-radius:16px}
.claim.caught{background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.meter{height:10px;border-radius:5px}.meter i{border-radius:5px;background:linear-gradient(90deg,var(--brass),color-mix(in srgb,var(--brass) 60%,var(--accent2)))}
.meter em{width:4px;border-radius:2px;top:-3px;height:16px}
input[type=number]{border-radius:16px;border-color:transparent;background:var(--sunk);font-weight:800}
.overlay{background:rgba(50,35,70,.3);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.dialog{border:0;border-radius:30px}
.report li{border-radius:14px;border-left-width:4px}
.toast{border-radius:18px}
.tile:hover,.row-card:hover,.mbtn:hover{border-color:transparent;transform:translateY(-2px)}
.tile,.row-card{transition:transform .15s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<section id="menu">
  <div class="menu-box">
    <div>
      <span class="tag">İkinci el lüks eşya</span>
      <h1 class="wordmark">İkinci<b>Vitrin</b></h1>
      <p class="menu-sub">Pazar tezgâhından lüks showroom'a. İlanı bul, satıcıyı çöz, sahteyi yakala, kârla sat.</p>
    </div>
    <div class="menu-btns">
      <button class="mbtn primary" id="btnContinue" data-act="continue" hidden>Devam et <small id="contInfo"></small></button>
      <button class="mbtn" id="btnNew" data-act="newask">Yeni oyun</button>
      <button class="mbtn" data-act="howto">Nasıl oynanır</button>
    </div>
  </div>
</section>

<section id="game" hidden>
  <header class="bar"><div class="app">
    <button class="back" data-act="back" aria-label="Geri" id="backBtn"></button>
    <div class="when"><b id="hDay"></b><span id="hSeason"></span></div>
    <div class="pill num" id="hCash"></div>
    <div class="pill num" id="hRep" title="İtibar"></div>
  </div></header>
  <main class="app" id="screen"></main>
  <nav class="tabbar"><div class="app" id="tabs"></div></nav>
</section>

<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= VERİ ================= */
const START=40000, SAVE='ikinci-vitrin-v2';
const CATS={saat:['Saat',210],canta:['Çanta',20],mucevher:['Mücevher',300],gozluk:['Gözlük',180],ayakkabi:['Ayakkabı',30],kalem:['Kalem',250],giyim:['Giyim',140]};
const ITEMS=[

const FMT=new Intl.NumberFormat('tr-TR');
const TL=n=>(n<0?'−':'')+FMT.format(Math.abs(Math.round(n)))+' ₺';
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r100=n=>Math.max(100,Math.round(n/100)*100);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= DEĞERLER ================= */
const T=it=>ITEMS[it.t];
const season=()=>SEASONS[Math.floor((S.day-1)/10)%4];
const mkt=it=>T(it).base*KOND[it.cond].k*S.trend[T(it).cat]*(season().m[T(it).cat]||1);
const defSum=list=>list.reduce((s,d)=>s+DEF[d].p,0);
const real=it=>mkt(it)*(1-defSum(it.defects))*(it.fake?.05:1);
const knownDefs=it=>it.lup?it.defects:it.defects.filter(d=>it.kd.includes(d));
function est(it){
  if(it.full) {const v=real(it);return [v,v,v]}
  const n=1+(it.noise-1)*(it.lup?.5:1);
  const c=mkt(it)*(1-defSum(knownDefs(it))-(it.lup?0:.06))*n;
  const w=.26-(it.lup?.1:0)-(it.serial?.05:0);
  return [r100(c*(1-w)),r100(c),r100(c*(1+w))];
}
function authLabel(it){
  if(it.full) return it.fake?['Kesin sahte','bad']:['Kesin orijinal','good'];
  if(it.serial==='temiz') return ['Kayıt temiz','good'];
  if(it.serial==='supheli') return ['Şüpheli kayıt','warn'];
  return ['Orijinallik bilinmiyor',''];
}
const testCost={lup:it=>r100(Math.max(300,T(it).base*.005)),seri:it=>r100(Math.max(500,T(it).base*.01)),uzman:it=>r100(Math.max(1500,T(it).base*.025))};
const fixCost=d=>it=>r100(T(it).base*DEF[d].p*.45);
const cleanCost=it=>r100(Math.max(200,T(it).base*.008));
const PHOTO=600;
const lvl=()=>LEVELS[S.level];
const repStars=r=>Math.round(r/20);
const loanLimit=()=>lvl().loan+S.rep*200;
function buyerValue(it){
  let v=mkt(it)*(1-defSum(it.disclose?knownDefs(it):[]));
  if(it.full) v*=it.fake?.05:1.08;
  if(it.clean) v*=1.04; if(it.photo) v*=1.03;
  return v*lvl().pres*(.75+.005*S.rep);
}
const netWorth=()=>S.cash-S.debt+S.inv.reduce((s,it)=>s+est(it)[1],0);

function newItem(maxBase,minCond=0){
  const pool=ITEMS.map((x,i)=>i).filter(i=>ITEMS[i].base<=maxBase);
  const t=pick(pool), cat=ITEMS[t].cat, roll=Math.random();
  const cond=Math.max(minCond,roll<.2?0:roll<.55?1:roll<.85?2:3);
  const opts=DEF.map((d,i)=>i).filter(i=>!DEF[i].c||DEF[i].c.includes(cat));
  const n=Math.random()<.45?0:Math.random()<.73?1:2, defects=[];
  while(defects.length<n){const d=pick(opts);if(!defects.includes(d))defects.push(d)}
  return {id:S.uid++,t,cond,fake:false,defects,kd:[],noise:R(.88,1.12),lup:false,serial:null,full:false,
          clean:false,photo:false,paid:0,listed:null,disclose:true,docs:false};
}
function genListings(){
  S.listings=[];
  const n=4+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const p=pick(PERSONAS), it=newItem(lvl().maxBase);
    it.fake=Math.random()<p.fake; it.docs=!it.fake&&Math.random()<.55;
    const ratio=R(p.lo,p.hi), ask=r100(mkt(it)*ratio*(1-defSum(it.defects)*.3));
    const title=ratio<.68?pick(['ACİL! Kelepir fiyat','Acil satılık, kaçmaz']):ratio>1.05?pick(['Koleksiyonluk parça','Nadir bulunur']):pick(['Temiz, az kullanılmış','Sahibinden, bakımlı','Fiyat son']);
    S.listings.push({id:S.uid++,item:it,seller:person(),persona:PERSONAS.indexOf(p),ask,first:ask,min:r100(ask*R(.72,.9)),
      patience:2+Math.floor(Math.random()*2),title,chat:[],claims:[],asked:[],leverage:false,used:false,seen:false});
  }
}
function genAuctions(){
  S.auctions=[];
  const kinds=['Sigorta hasarlı','Konkordato tasfiyesi','Gümrük mezatı','Rehin mezatı'];
  for(let i=0;i<2;i++){
    const it=newItem(lvl().maxBase*1.5); it.cond=Math.min(it.cond,1);
    if(!it.defects.length) it.defects.push(pick(DEF.map((d,i)=>i).filter(i=>!DEF[i].c||DEF[i].c.includes(T(it).cat))));
    it.lup=true; it.serial='temiz'; it.full=true;
    const after=mkt(it), start=r100(real(it)*.4), step=r100(Math.max(500,start*.06));
    S.auctions.push({id:S.uid++,item:it,kind:pick(kinds),start,step,bid:start,leader:null,
      rivalMax:r100(after*R(.42,.72)),rival:pick(RIVALS),done:false,won:false});
  }
}
function newGame(){
  S={day:1,cash:START,debt:0,rep:50,level:0,uid:1,trend:{},listings:[],auctions:[],inv:[],offers:[],pending:[],

  for(const c in CATS) S.trend[c]=R(.92,1.08);
  genListings(); genAuctions(); save(); view={tab:'home',id:null}; showGame();
}

function valueMeter(lo,hi,price){
  const max=Math.max(hi,price)*1.15, L=lo/max*100, W=Math.max(1.5,(hi-lo)/max*100), P=price/max*100;
  return `<div class="meter" aria-hidden="true"><i style="left:${L}%;width:${W}%"></i><em style="left:${P}%"></em></div>
   <div class="muted" style="font-size:12px;margin:6px 0 4px">Altın bant tahmini değer, pembe çizgi fiyat.</div>`;
}
function caught(l,c){return c.lie&&((c.k==='kusur'&&l.item.lup&&l.item.defects.length)||(c.k==='belge'&&(l.item.serial==='supheli'||(l.item.full&&l.item.fake))))}
function testsHTML(it,ref){
  const T3=[['lup','Lup ile inceleme','Gizli kusurları bulur',it.lup],['seri','Seri no sorgusu','Sahteyi çoğu zaman yakalar',!!it.serial],

    `<button class="btn" data-act="test" data-t="${k}" data-ref="${ref}" ${S.cash<testCost[k](it)?'disabled':''}>${TL(testCost[k](it))}</button>`}</div>`).join('');
}

/* ================= EYLEMLER ================= */
function bindInputs(){
  const inp=$('#offerIn'),rg=$('#offerRange');
  if(inp&&rg){const b=+rg.dataset.base;rg.oninput=()=>inp.value=r100(b*rg.value/100);inp.oninput=()=>rg.value=clamp(Math.round(inp.value/b*100),40,100)}
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function openDlg(html){$('#dialog').innerHTML=html;$('#overlay').hidden=false;const f=$('#dialog').querySelector('button.primary,button');f&&f.focus()}
function closeDlg(){$('#overlay').hidden=true}
const say=(l,t,me)=>l.chat.push({t,me:!!me});

function ask(l,q){
  const it=l.item,P=PERSONAS[l.persona];
  l.asked.push(q);
  if(q==='neden'){say(l,'Neden satıyorsunuz?',1);say(l,pick(P.why))}
  if(q==='belge'){say(l,'Kutusu, faturası var mı?',1);
    if(it.docs){say(l,'Kutusu da faturası da tam, gösteririm.');l.claims.push({k:'belge',t:'Belgeleri tam dedi.'})}
    else if(it.fake){const t=pick(['Faturası var ama evde kaldı.','Orijinal, faturası bende bir yerde.']);say(l,t);l.claims.push({k:'belge',lie:true,t:`"${t}" dedi.`})}
    else {say(l,'Maalesef kutusu da faturası da yok.');l.claims.push({k:'belge',t:'Belgesi yok, açıkça söyledi.'})}}
  if(q==='kusur'){say(l,'Hiç kusuru var mı?',1);
    if(!it.defects.length){say(l,'Hiçbir kusuru yok, istediğiniz gibi bakın.');l.claims.push({k:'kusur',t:'Kusursuz dedi.'})}
    else if(Math.random()<P.honest){const d=it.defects[0];it.kd.push(d);say(l,`Saklamayayım: ${DEF[d].ad.toLowerCase()} var.`);l.claims.push({k:'kusur',t:`${DEF[d].ad} olduğunu kendisi söyledi.`})}
    else {say(l,'Kusursuz, sıfır ayarında.');l.claims.push({k:'kusur',lie:true,t:'Kusursuz dedi.'})}}
  checkLeverage(l);
}
function checkLeverage(l){if(!l.leverage&&l.claims.some(c=>caught(l,c))){l.leverage=true;toast('Satıcının yalanını yakaladın! Pazarlıkta kanıtı kullanabilirsin.')}}
function runTest(it,k,l){
  const c=testCost[k](it); if(S.cash<c) return toast('Ekspertiz için para yetmiyor.');
  S.cash-=c; let msg='';
  if(k==='lup'){it.lup=true;msg=it.defects.length?`Lup: ${it.defects.map(d=>DEF[d].ad.toLowerCase()).join(', ')} bulundu.`:'Lup: kusur bulunamadı.'}
  if(k==='seri'){it.serial=it.fake?(Math.random()<.85?'supheli':'temiz'):(Math.random()<.95?'temiz':'supheli');msg=it.serial==='temiz'?'Seri no kaydı temiz.':'Seri no kaydı şüpheli!'}
  if(k==='uzman'){it.full=true;it.lup=true;it.serial=it.fake?'supheli':'temiz';msg=it.fake?'Uzman raporu: SAHTE.':`Uzman raporu: orijinal, değeri ${TL(real(it))}.`}
  if(l) checkLeverage(l);
  save(); render(); toast(msg);
}
function buyListing(l,price){
  if(S.inv.length>=lvl().cap) return toast('Stokta yer yok. Önce sat ya da dükkânı büyüt.');
  if(S.cash<price) return toast('Kasada yeterli para yok.');
  S.cash-=price; l.item.paid=price; l.item.disclose=true; S.inv.push(l.item); S.stats.bought++;
  S.listings=S.listings.filter(x=>x!==l); save(); go('stok',l.item.id); toast(`${T(l.item).ad} ${TL(price)}'ye alındı.`);
}
function offer(l){
  const v=r100(+$('#offerIn').value||0);
  if(v>S.cash) return toast('Kasada bu kadar para yok.');
  if(v>=l.ask) return buyListing(l,l.ask);
  say(l,`${TL(v)} veriyorum.`,1);
  if(v>=l.min){say(l,'Tamam, anlaştık.');return buyListing(l,v)}
  l.patience-= v<l.min*.65?2:1;
  if(l.patience<=0){S.listings=S.listings.filter(x=>x!==l);save();go('ilan');return toast(`${l.seller} sinirlendi ve telefonu kapattı. İlan kaldırıldı.`)}
  const counter=r100(Math.max(l.min,(l.ask+l.min)/2));
  say(l,v<l.min*.65?`Ciddi misiniz? En fazla ${TL(counter)}'ye inerim.`:pick(['Biraz daha yaklaşın.','O fiyata veremem.','Malın değeri belli.'])+` ${TL(counter)} olur.`);
  l.ask=counter; save(); render();
}
function evidence(l){
  l.used=true; const c=l.claims.find(c=>caught(l,c));
  say(l,c.k==='kusur'?`Kusursuz dediniz ama lupla bakınca ${knownDefs(l.item).map(d=>DEF[d].ad.toLowerCase()).join(', ')} çıktı.`:'Belgeleri var dediniz, seri no kaydı şüpheli çıktı.',1);
  l.min=r100(l.min*.85); l.ask=r100(Math.max(l.min,l.ask*.85)); l.patience=Math.max(l.patience,2);
  say(l,`Peki... haklısınız. ${TL(l.ask)} olsun.`); save(); render();
}
function walk(l){
  say(l,'Kusura bakmayın, bu fiyata olmaz. Kolay gelsin.',1);
  if(Math.random()<.45&&l.ask>l.min){l.ask=r100(Math.max(l.min,l.ask*.9));say(l,`Dur dur! ${TL(l.ask)} olsun, son fiyat.`);save();render();return toast(`${l.seller} geri aradı.`)}
  S.listings=S.listings.filter(x=>x!==l); save(); go('ilan'); toast('Masadan kalktın. İlan listeden çıktı.');
}
function bid(a){
  const price=a.leader?a.bid+a.step:a.bid;
  if(S.cash<price*1.05) return toast('Bu teklif için kasada para yok (komisyon dahil).');
  if(S.inv.length>=lvl().cap) return toast('Stokta yer yok.');
  a.bid=price; a.leader='Sen';
  if(price+a.step<=a.rivalMax){a.bid=price+a.step;a.leader=Math.random()<.7?a.rival:pick(RIVALS)}
  save(); render();
}
function hammer(a){
  if(a.leader!=='Sen') return;
  a.done=true; a.won=true; const cost=r100(a.bid*1.05);
  S.cash-=cost; a.item.paid=cost; S.inv.push(a.item); S.stats.bought++; save(); render(); toast(`Çekiç indi! ${TL(cost)} ödendi.`);
}
function fold(a){a.done=true;a.won=false;if(a.leader==='Sen'||!a.leader)a.leader=a.rival;save();render()}
function fix(it,k){
  const kd=knownDefs(it), sumKnown=kd.reduce((s,d)=>s+fixCost(d)(it),0);
  const cost=k==='ucuz'?r100(sumKnown*.5):k==='standart'?sumKnown:r100(it.defects.reduce((s,d)=>s+fixCost(d)(it),0)*1.3+T(it).base*.04);
  if(S.cash<cost) return toast('Tamir için para yetmiyor.');
  S.cash-=cost; let msg;
  if(k==='ucuz'){const fixed=kd.filter(()=>Math.random()<.6);it.defects=it.defects.filter(d=>!fixed.includes(d));msg=fixed.length===kd.length?'Ucuz tamir tuttu, hepsi giderildi.':`Ucuz tamir: ${kd.length-fixed.length} kusur giderilemedi.`}
  if(k==='standart'){it.defects=it.defects.filter(d=>!kd.includes(d));msg='Bilinen kusurlar giderildi.'}
  if(k==='premium'){const hidden=it.defects.filter(d=>!kd.includes(d)).length;it.defects=[];it.cond=Math.min(3,it.cond+1);msg=`Usta işi! Durum: ${KOND[it.cond].ad}.`+(hidden?` Gizli ${hidden} kusur da giderildi.`:'')}
  it.kd=it.kd.filter(d=>it.defects.includes(d)); save(); render(); toast(msg);
}
function sell(it,price,rep){
  S.inv=S.inv.filter(x=>x!==it); S.offers=S.offers.filter(o=>o.itemId!==it.id);
  S.cash+=price; S.stats.sold++; const p=price-it.paid; S.stats.profit+=p;
  const hidden=it.defects.filter(d=>!(it.disclose&&knownDefs(it).includes(d)));
  S.pending.push({ad:T(it).ad,price,fake:it.fake&&!it.full,hidden:hidden.map(d=>({d,v:r100(T(it).base*KOND[it.cond].k*DEF[d].p*.8)})),
    disclosed:it.disclose&&knownDefs(it).length>0,cert:it.full&&!it.fake,buyer:person()});
  rep&&rep.push({c:p>=0?'good':'bad',m:`${T(it).ad} ${TL(price)}'ye satıldı (${p>=0?'kâr':'zarar'} ${TL(Math.abs(p))}).`});
  return p;
}
function review(s,n,t){S.reviews.unshift({s,n,t});S.reviews=S.reviews.slice(0,12)}

/* ================= GÜN SONU ================= */
function endDay(){
  const rep=[];
  for(const s of S.pending){
    if(s.fake&&Math.random()<.65){S.cash-=s.price;S.rep=clamp(S.rep-15,0,100);review(1,s.buyer,`${s.ad} sahte çıktı! Paramı zor geri aldım.`);
      rep.push({c:'bad',m:`${s.ad} sahte çıktı. Alıcı iade etti: ${TL(s.price)} geri ödendi, itibar −15.`});continue}
    let comp=0; for(const h of s.hidden) if(Math.random()<.5) comp+=h.v;
    if(comp){S.cash-=comp;S.rep=clamp(S.rep-6,0,100);review(2,s.buyer,`${s.ad} ilanda yazmayan kusurla geldi.`);
      rep.push({c:'bad',m:`${s.ad} alıcısı gizli kusur buldu. Tazminat ${TL(comp)}, itibar −6.`});continue}
    const up=1+(s.disclosed?1:0)+(s.cert?1:0); S.rep=clamp(S.rep+up,0,100);
    review(s.cert||s.disclosed?5:4,s.buyer,s.disclosed?'Kusurları dürüstçe yazmışlar, ürün anlatıldığı gibi.':s.cert?'Ekspertiz raporuyla geldi, içim rahat.':'Sorunsuz alışveriş.');
  }
  S.pending=[]; S.offers=[];
  for(const it of S.inv) if(it.listed){
    const pr=Math.min(.95,.5+(it.photo?.2:0)+S.level*.05);
    if(Math.random()>pr) continue;
    const r=Math.random(), type=S.level>=2&&r<.22?'vip':r<.45?'acil':'pazarlik', B=BUYERS[type];
    const amt=Math.min(it.listed,r100(buyerValue(it)*R(B.lo,B.hi)));
    if(amt<it.listed*.5) continue;
    S.offers.push({id:S.uid++,itemId:it.id,amount:amt,type,buyer:person(),line:amt>=it.listed?'İlan fiyatınıza alıyorum.':pick(B.lines),countered:false});
  }
  if(S.offers.length) rep.push({c:'brass',m:`Telefon çaldı: ${S.offers.length} alıcı teklif verdi.`});
  S.cash-=lvl().rent; rep.push({c:'',m:`Kira ödendi: ${TL(lvl().rent)}.`});
  if(S.debt>0){const f=r100(S.debt*.01);S.debt+=f;rep.push({c:'',m:`Kredi faizi: ${TL(f)} borca eklendi.`})}
  const oldSeason=season();
  S.day++;
  for(const c in CATS) S.trend[c]=clamp(S.trend[c]*R(.95,1.05)+(1-S.trend[c])*.08,.6,1.6);
  const c=pick(Object.keys(CATS)), up=Math.random()<.55, cn=CATS[c][0].toLowerCase();
  S.trend[c]=clamp(S.trend[c]*(up?R(1.15,1.3):R(.75,.87)),.6,1.6);
  S.news=[up?pick([`${CATS[c][0]} modası geri döndü, ${cn} fiyatları yükseliyor.`,`Bir dizi yıldızı yayında ${cn} taktı, talep patladı.`,`Koleksiyoner fuarı yaklaşıyor: ${cn} aranıyor.`])
            :pick([`${CATS[c][0]} piyasasında stok fazlası var, fiyatlar düşüyor.`,`İnternette ${cn} ilanları çoğaldı, alıcılar pazarlıkçı.`,`${CATS[c][0]} talebi bu hafta durgun.`])];
  if(season()!==oldSeason) S.news.unshift(`${season().ad} geldi. ${season().why}`);
  if(Math.random()<.3) S.news.push(pick(['Sahte ürün operasyonu: polis bir depoda yüzlerce taklit ele geçirdi. Ekspertizsiz alma!','Döviz yükseldi, ithal lüks ürünler pahalandı.','Mezat sezonu: tasfiye ürünleri artıyor.']));
  if(S.cash<0&&S.debt+(-S.cash)<=loanLimit()){const need=r100(-S.cash);S.debt+=need;S.cash+=need;rep.push({c:'bad',m:`Kasa eksiye düştü. Banka otomatik ${TL(need)} kredi açtı.`})}
  genListings(); genAuctions(); save(); view={tab:'home',id:null}; render(); scrollTo(0,0);
  openDlg(`<h2>Gün ${S.day}</h2><p class="lead">${season().ad} · ${lvl().ad}</p><ul class="report">${rep.map(r=>`<li class="${r.c}">${esc(r.m)}</li>`).join('')}
    <li class="brass">${S.listings.length} yeni ilan ve 2 mezat lotu seni bekliyor.</li></ul>
    <button class="btn primary wide" data-act="close">Dükkânı aç</button>`);
}

/* ================= OLAYLAR ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  const act=b.dataset.act, id=+b.dataset.id;
  const L=()=>S.listings.find(x=>x.id===id), I=()=>S.inv.find(x=>x.id===id), A=()=>S.auctions.find(x=>x.id===id);
  switch(act){
    case 'continue': S=load(); if(S){view={tab:'home',id:null};showGame()} break;
    case 'newask': if(load()) openDlg(`<h2>Yeni oyun?</h2><p class="lead">Kayıtlı oyunun silinecek.</p><div class="btns"><button class="btn" data-act="close">Vazgeç</button><button class="btn primary" data-act="new">Yeni oyuna başla</button></div>`); else newGame(); break;
    case 'new': closeDlg(); newGame(); break;
    case 'howto': openDlg(`<div class="howto"><h2>Nasıl oynanır</h2><p class="lead">Pazar tezgâhından lüks showroom'a yüksel.</p><ol>
      <li><b>İlanlar:</b> Satıcıya soru sor, cevaplar not defterine yazılır.</li>
      <li><b>Ekspertiz:</b> Lup kusurları, seri no sahteyi, uzman raporu her şeyi gösterir. Satıcının yalanını yakalarsan kanıtı pazarlıkta kullan.</li>
      <li><b>Pazarlık:</b> Teklif ver ya da kalkıp git. Bazı satıcılar geri arar.</li>
      <li><b>Mezat:</b> Hasarlı ürünleri ucuza kap, tamir et, sat.</li>
      <li><b>Stok:</b> Tamir, temizlik ve fotoğrafla değeri artır, fiyat verip ilana koy. Kusurları yazarsan güven kazanırsın, saklarsan tazminat ödeyebilirsin.</li>
      <li><b>Dükkân:</b> Alıcılar gün sonunda arar. Kira öde, itibar topla, dükkânı büyüt.</li></ol>
      <button class="btn primary wide" data-act="close">Anladım</button></div>`); break;
    case 'close': closeDlg(); break;
    case 'back': if(view.id) go(view.tab); else {save();showMenu()} break;
    case 'tab': go(b.dataset.tab); break;
    case 'openL': go('ilan',id); break;
    case 'openI': go('stok',id); break;
    case 'ask': {const l=L(); if(l){ask(l,b.dataset.q);save();render()} break}
    case 'test': {const r=b.dataset.ref, n=+r.slice(1); if(r[0]==='L'){const l=S.listings.find(x=>x.id===n); l&&runTest(l.item,b.dataset.t,l)} else {const it=S.inv.find(x=>x.id===n); it&&runTest(it,b.dataset.t)} break}
    case 'offer': {const l=L(); l&&offer(l); break}
    case 'buyL': {const l=L(); l&&buyListing(l,l.ask); break}
    case 'evidence': {const l=L(); l&&evidence(l); break}
    case 'walk': {const l=L(); l&&walk(l); break}
    case 'bid': {const a=A(); a&&bid(a); break}
    case 'hammer': {const a=A(); a&&hammer(a); break}
    case 'fold': {const a=A(); a&&fold(a); break}
    case 'fix': {const it=I(); it&&fix(it,b.dataset.k); break}
    case 'clean': {const it=I(); if(it){S.cash-=cleanCost(it);it.clean=true;save();render();toast('Temizlendi, parlıyor.')} break}
    case 'photo': {const it=I(); if(it){S.cash-=PHOTO;it.photo=true;save();render();toast('Profesyonel fotoğraflar çekildi.')} break}
    case 'qprice': $('#priceIn').value=b.dataset.v; break;
    case 'list': {const it=I(); if(it){const v=r100(+$('#priceIn').value||0); it.listed=v; const d=$('#disc'); if(d) it.disclose=d.checked;
      S.offers=S.offers.filter(o=>o.itemId!==it.id); save(); render(); toast(`İlanda: ${TL(v)}. Alıcılar gün sonunda arar.`)} break}
    case 'unlist': {const it=I(); if(it){it.listed=null;S.offers=S.offers.filter(o=>o.itemId!==it.id);save();render()} break}
    case 'accept': {const o=S.offers.find(x=>x.id===id), it=o&&S.inv.find(x=>x.id===o.itemId);
      if(it){const p=sell(it,o.amount);save();render();toast(`Satıldı! ${p>=0?'Kâr':'Zarar'}: ${TL(Math.abs(p))}`)} break}
    case 'counter': {const o=S.offers.find(x=>x.id===id), it=o&&S.inv.find(x=>x.id===o.itemId); if(!it)break;
      if(Math.random()<BUYERS[o.type].acc){o.amount=it.listed;o.countered=true;o.line='Peki, ilan fiyatınız olsun.';toast(`${o.buyer} kabul etti.`)}
      else {S.offers=S.offers.filter(x=>x!==o);toast(`${o.buyer} vazgeçti.`)} save(); render(); break}
    case 'reject': S.offers=S.offers.filter(x=>x.id!==id); save(); render(); break;
    case 'upgrade': {const n=LEVELS[S.level+1]; if(n&&S.cash>=n.price){S.cash-=n.price;S.level++;S.news.unshift(`Yeni ${n.ad.toLowerCase()} açıldı! Stok yeri ${n.cap}, daha pahalı ilanlar ve daha iyi alıcılar.`);genListings();save();render();
      openDlg(`<h2>${n.ad}</h2><p class="lead">Tebrikler, dükkânın büyüdü.</p><ul class="report"><li class="good">Stok yeri: ${n.cap}</li><li class="good">İlanlarda daha değerli ürünler</li><li class="good">Alıcılar daha fazla ödüyor</li>${S.level>=2?'<li class="brass">VIP koleksiyonerler aramaya başladı</li>':''}<li>Günlük kira: ${TL(n.rent)}</li></ul><button class="btn primary wide" data-act="close">Harika</button>`)} break}
    case 'borrow': {const v=+b.dataset.v; if(S.debt+v<=loanLimit()){S.debt+=v;S.cash+=v;save();render();toast(`${TL(v)} kredi kasaya geçti.`)} break}
    case 'repay': {const v=b.dataset.v==='all'?Math.min(S.debt,S.cash):Math.min(10000,S.debt,S.cash); if(v>0){S.debt-=v;S.cash-=v;save();render();toast(`${TL(v)} borç ödendi.`)} break}
    case 'endday': endDay(); break;
  }
});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeDlg();if(e.key==='Enter'&&e.target.id==='offerIn'){const l=S.listings.find(x=>x.id===view.id);l&&offer(l)}});
showMenu();
</script>

</html>
