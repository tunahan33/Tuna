<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Tribün Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Düzen: gece maçı skorbordu üstte, solda işletme listesi, sağda sekmeli yönetim paneli */
:root {
  --bg: #17181c;          /* antrasit tribün */
  --panel: #202228;
  --line: #33363f;
  --fg: #eceae4;
  --muted: #9a9ca6;
  --yellow: #f5c518;      /* kulüp sarısı */
  --red: #d7263d;         /* kulüp kırmızısı */
  --green: #3fbf6f;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }

/* Skorbord */
.board {
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  background: #0e0f12; border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 20px; position: relative; overflow: hidden;
}
.board::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 4px;
  background: linear-gradient(90deg, var(--yellow) 0 50%, var(--red) 50% 100%);
}
.brand { font: 900 30px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand span { color: var(--yellow); }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; }
.stat { min-width: 0; }
.stat-label { font: 600 11px/1 var(--font-num); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat-val { font: 700 30px/1.1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--yellow); white-space: nowrap; }
.stat-val.small { font-size: 22px; color: var(--fg); }
.boost { color: var(--green); font: 600 12px/1 var(--font-num); letter-spacing: .06em; text-transform: uppercase; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }

/* İşletmeler */
.bar-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.h { font: 700 18px/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.modes button { background: transparent; border: 0; padding: 6px 12px; font: 600 14px/1 var(--font-num); color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--yellow); color: #17181c; }
.list { display: grid; gap: 10px; }
.biz {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
.biz.locked { opacity: .55; }
.badge {
  width: 64px; height: 64px; border-radius: 50%; border: 0; position: relative;
  background: radial-gradient(circle at 35% 30%, #3a3d46, #24262c);
  display: grid; place-items: center; font: 900 20px/1 var(--font-display); color: var(--yellow);
  box-shadow: inset 0 0 0 3px var(--line);
}
.badge:disabled { cursor: default; }
.badge .cnt {
  position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
  background: var(--red); color: #fff; font: 700 12px/1 var(--font-num); padding: 3px 7px; border-radius: 10px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.biz.ready .badge { box-shadow: inset 0 0 0 3px var(--yellow); }
.info { min-width: 0; display: grid; gap: 6px; }
.row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mgr { font: 600 11px/1 var(--font-num); letter-spacing: .1em; text-transform: uppercase; color: var(--green); white-space: nowrap; }
.prog { position: relative; height: 26px; background: #121317; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #b8920f, var(--yellow)); }
.prog-txt {
  position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 8px;
  font: 700 14px/1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--fg); text-shadow: 0 1px 2px #000;
}
.row3 { display: flex; gap: 8px; align-items: center; }
.buy {
  flex: 1; min-width: 0; background: #2c2f37; border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px;
  display: flex; justify-content: space-between; gap: 8px; font: 600 14px/1.1 var(--font-num); font-variant-numeric: tabular-nums;
}
.buy:not(:disabled):hover { border-color: var(--yellow); }
.buy.can { background: #3a3220; border-color: #806a1c; }
.buy:disabled { cursor: not-allowed; color: var(--muted); }
.ms { font: 500 12px/1 var(--font-num); color: var(--muted); white-space: nowrap; }

/* Panel */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { background: transparent; border: 0; padding: 12px 6px; font: 700 15px/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--red); }
.tab-body { padding: 12px; display: grid; gap: 8px; max-height: 70vh; overflow-y: auto; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 6px; background: #1b1d22; }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card-title { font-weight: 600; }
.card-desc { color: var(--muted); font-size: 13px; }
.act {
  background: var(--yellow); color: #17181c; border: 0; border-radius: 5px; padding: 7px 10px;
  font: 700 14px/1 var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.act:disabled { background: #3a3d46; color: var(--muted); cursor: not-allowed; }
.act.red { background: var(--red); color: #fff; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
.big-fans { font: 700 40px/1 var(--font-num); color: var(--yellow); font-variant-numeric: tabular-nums; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; }

/* Bilet gişesi */
.gate {
  display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px dashed #4a4d57;
  border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; flex-wrap: wrap;
}
.gate .act { padding: 10px 16px; font-size: 16px; }
.gate p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; min-width: 160px; }

/* Altın top */
.ball {
  position: fixed; width: 54px; height: 54px; border-radius: 50%; border: 0; z-index: 20;
  background: radial-gradient(circle at 35% 30%, #fff6c8, var(--yellow) 45%, #a77f00);
  box-shadow: 0 0 0 4px rgba(245,197,24,.25), 0 6px 18px rgba(0,0,0,.5);
  font: 900 13px/1 var(--font-display); color: #3a2c00; text-transform: uppercase;
  animation: bob 1.4s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translateY(-8px); } }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  background: #0e0f12; border: 1px solid var(--yellow); color: var(--fg); padding: 10px 16px; border-radius: 8px;
  z-index: 30; max-width: calc(100% - 32px); text-align: center; font-weight: 500;
}
.foot { color: var(--muted); font-size: 12px; text-align: center; }
.foot button { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }

@media (prefers-reduced-motion: reduce) { .ball { animation: none; } }
@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
  .panel { position: static; }
  .tab-body { max-height: none; }
}
@media (max-width: 560px) {
  .board { grid-template-columns: 1fr; }
  .stats { gap: 16px; }
  .stat-val { font-size: 24px; }
  .brand { font-size: 26px; }
  .biz { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; }
  .badge { width: 52px; height: 52px; font-size: 17px; }
}
</style>

<div class="wrap">
  <header class="board">
    <div>
      <h1 class="brand">Tribün <span>Tycoon</span></h1>
      <div class="sub">Forma tezgâhından Süper Lig kulübüne: spor imparatorluğunu kur.</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Kasa</div><div class="stat-val" id="money">0 ₺</div></div>
      <div class="stat"><div class="stat-label">Saniyede</div><div class="stat-val small" id="rate">0 ₺</div><div class="boost" id="boost" hidden></div></div>
      <div class="stat"><div class="stat-label">Taraftar</div><div class="stat-val small" id="fans">0</div></div>
    </div>
  </header>

  <div class="main">
    <section>
      <div class="gate">
        <button class="act" id="ticket" type="button">Bilet sat</button>
        <p id="ticketTxt">Gişede bilet sat, ilk işletmeni çalıştırmak için para topla.</p>
      </div>
      <div class="bar-top">
        <h2 class="h">İşletmeler</h2>
        <div class="modes" role="group" aria-label="Satın alma miktarı" id="modes"></div>
      </div>
      <div class="list" id="list"></div>
    </section>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" type="button" data-tab="mgr" id="tab-mgr">Menajer</button>
        <button role="tab" type="button" data-tab="upg" id="tab-upg">Yükseltme</button>
        <button role="tab" type="button" data-tab="fan" id="tab-fan">Taraftar</button>
      </div>
      <div class="tab-body" id="tabBody"></div>
    </aside>
  </div>

  <p class="foot">Oyun bu tarayıcıda otomatik kaydedilir. Menajerli işletmeler sen yokken de kazanır (en fazla 8 saat). · <button type="button" id="resetBtn">Sıfırdan başla</button></p>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  "use strict";

  // ---- Oyun verisi ----
  const BIZ = [
    { id: "forma",   name: "Forma Tezgâhı",     code: "FT", cost: 4,        rate: 1.07, rev: 1,         time: 0.8 },
    { id: "atki",    name: "Atkı Atölyesi",     code: "AT", cost: 60,       rate: 1.15, rev: 60,        time: 3 },
    { id: "magaza",  name: "Spor Mağazası",     code: "SM", cost: 720,      rate: 1.14, rev: 540,       time: 6 },
    { id: "okul",    name: "Futbol Okulu",      code: "FO", cost: 8640,     rate: 1.13, rev: 4320,      time: 12 },
    { id: "hali",    name: "Halı Saha",         code: "HS", cost: 103680,   rate: 1.12, rev: 51840,     time: 24 },
    { id: "fitness", name: "Fitness Zinciri",   code: "FZ", cost: 1244160,  rate: 1.11, rev: 622080,    time: 96 },
    { id: "tv",      name: "Spor Kanalı",       code: "TV", cost: 14929920, rate: 1.10, rev: 7464960,   time: 384 },
    { id: "stad",    name: "Stadyum",           code: "ST", cost: 179159040, rate: 1.09, rev: 89579520, time: 1536 },
    { id: "kulup",   name: "Süper Lig Kulübü",  code: "SL", cost: 2149908480, rate: 1.08, rev: 1074954240, time: 6144 }
  ];
  const MANAGERS = [
    ["Mahalle Abisi", 1e3], ["Usta Terzi", 15e3], ["Mağaza Şefi", 1e5], ["Teknik Direktör", 5e5],
    ["Saha Müdürü", 1.2e6], ["Antrenör Ece", 1e7], ["Yayın Yönetmeni", 1.1e8], ["Stat Müdürü", 5.5e8], ["Başkan", 1e10]
  ].map(([name, cost], i) => ({ i, name, cost }));
  const MILESTONES = [25, 50, 100, 200, 300, 400, 500, 600, 800, 1000];

  // Yükseltmeler: her işletmeye ×3 ve bütün işletmelere ×3
  const UPGRADES = [];
  const UPG_NAMES = [
    ["Lisanslı kumaş", "Rakip forması", "Retro koleksiyon"],
    ["Örme makinesi", "Derbi atkısı", "İmzalı atkı"],
    ["Vitrin ışıkları", "Online satış", "Avm şubesi"],
    ["Lisanslı antrenör", "Yaz kampı", "Altyapı anlaşması"],
    ["Gece aydınlatması", "Turnuva haftası", "Kapalı saha"],
    ["Grup dersleri", "Yıllık üyelik", "Franchise"],
    ["Maç özetleri", "Canlı yayın hakkı", "Uluslararası lig"],
    ["Loca satışı", "İsim sponsoru", "Konser geceleri"],
    ["Transfer dehası", "Avrupa kupası", "Şampiyonluk"]
  ];
  BIZ.forEach((b, i) => {
    [25, 400, 6000].forEach((k, j) => {
      UPGRADES.push({ id: b.id + j, target: i, mult: 3, cost: b.cost * k * Math.pow(10, j + 1), name: UPG_NAMES[i][j] });
    });
  });
  [["Sponsorluk anlaşması", 2.5e5], ["Marka lansmanı", 5e7], ["Halka arz", 2.5e10], ["Dünya markası", 1e14]].forEach(([name, cost], j) => {
    UPGRADES.push({ id: "all" + j, target: -1, mult: 3, cost, name });
  });
  UPGRADES.sort((a, b) => a.cost - b.cost);

  const FAN_BONUS = 0.02; // taraftar başına %2

  // ---- Durum ----
  const SAVE_KEY = "tribun-tycoon-v1";
  function freshState(keep) {
    return {
      money: 0,
      earned: 0,                         // bu sezon kazanılan
      allTime: keep ? keep.allTime : 0,  // tüm zamanlar
      fans: keep ? keep.fans : 0,
      seasons: keep ? keep.seasons : 0,
      biz: BIZ.map((_, i) => ({ n: i === 0 ? 1 : 0, p: 0, run: false, mgr: false })),
      upg: [],
      mode: keep ? keep.mode : "1",
      tab: keep ? keep.tab : "mgr",
      boostUntil: 0,
      last: Date.now()
    };
  }
  let S = freshState();

  function load(data) {
    if (!data || !Array.isArray(data.biz) || data.biz.length !== BIZ.length) return false;
    S = Object.assign(freshState(), data);
    return true;
  }
  function save() {
    S.last = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }

  // ---- Hesaplar ----
  function multOf(i) {
    let m = 1;
    for (const u of UPGRADES) if (S.upg.includes(u.id) && (u.target === i || u.target === -1)) m *= u.mult;
    m *= 1 + S.fans * FAN_BONUS;
    if (Date.now() < S.boostUntil) m *= 2;
    return m;
  }
  function speedOf(i) {
    const n = S.biz[i].n;
    let s = 1;
    for (const ms of MILESTONES) if (n >= ms) s *= 2;
    return s;
  }
  const cycleTime = i => BIZ[i].time / speedOf(i);
  const cycleRev = i => BIZ[i].rev * S.biz[i].n * multOf(i);
  function costFor(i, k) {
    const b = BIZ[i], n = S.biz[i].n;
    return b.cost * Math.pow(b.rate, n) * (Math.pow(b.rate, k) - 1) / (b.rate - 1);
  }
  function maxAffordable(i) {
    const b = BIZ[i], n = S.biz[i].n;
    const k = Math.floor(Math.log(S.money * (b.rate - 1) / (b.cost * Math.pow(b.rate, n)) + 1) / Math.log(b.rate));
    return Math.max(0, k);
  }
  function buyCount(i) {
    if (S.mode === "max") return Math.max(1, maxAffordable(i));
    return +S.mode;
  }
  function nextMilestone(n) { return MILESTONES.find(m => m > n) || null; }
  function incomePerSec() {
    let t = 0;
    S.biz.forEach((b, i) => { if (b.n > 0 && b.mgr) t += cycleRev(i) / cycleTime(i); });
    return t;
  }
  function fansAvailable() {
    return Math.floor(Math.sqrt(S.allTime / 1e8));
  }

  // ---- Biçimlendirme ----
  const SUFFIX = ["", "Bin", "Milyon", "Milyar", "Trilyon", "Katrilyon", "Kentilyon", "Sekstilyon", "Septilyon", "Oktilyon", "Nonilyon", "Desilyon"];
  const nf2 = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 2, minimumFractionDigits: 0 });
  const nf0 = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 });
  function fmt(x) {
    if (!isFinite(x)) return "∞";
    if (x < 1e6) return (x < 100 ? nf2 : nf0).format(x);
    let e = Math.floor(Math.log10(x) / 3);
    if (e >= SUFFIX.length) return x.toExponential(2).replace(".", ",");
    return nf2.format(x / Math.pow(1000, e)) + " " + SUFFIX[e];
  }
  const tl = x => fmt(x) + " ₺";
  function fmtTime(s) {
    if (s < 1) return nf2.format(s) + " sn";
    s = Math.ceil(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    const pad = v => String(v).padStart(2, "0");
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }

  // ---- Arayüz ----
  const $ = id => document.getElementById(id);
  const list = $("list");
  const rows = [];

  function buildList() {
    list.innerHTML = "";
    rows.length = 0;
    BIZ.forEach((b, i) => {
      const el = document.createElement("div");
      el.className = "biz";
      el.innerHTML = `
        <button class="badge" type="button" aria-label="${b.name} çalıştır">${b.code}<span class="cnt">0</span></button>
        <div class="info">
          <div class="row1"><span class="name">${b.name}</span><span class="mgr" hidden>Menajerli</span></div>
          <div class="prog"><div class="fill"></div><div class="prog-txt"><span class="rev"></span><span class="tm"></span></div></div>
          <div class="row3"><button class="buy" type="button"><span class="bq"></span><span class="bc"></span></button><span class="ms"></span></div>
        </div>`;
      const r = {
        el, badge: el.querySelector(".badge"), cnt: el.querySelector(".cnt"), mgr: el.querySelector(".mgr"),
        fill: el.querySelector(".fill"), rev: el.querySelector(".rev"), tm: el.querySelector(".tm"),
        buy: el.querySelector(".buy"), bq: el.querySelector(".bq"), bc: el.querySelector(".bc"), ms: el.querySelector(".ms")
      };
      r.badge.addEventListener("click", () => startCycle(i));
      r.buy.addEventListener("click", () => buy(i));
      list.appendChild(el);
      rows.push(r);
    });
  }

  function buildModes() {
    const m = $("modes");
    m.innerHTML = "";
    [["1", "×1"], ["10", "×10"], ["100", "×100"], ["max", "Max"]].forEach(([v, label]) => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.textContent = label; btn.dataset.mode = v;
      btn.setAttribute("aria-pressed", String(S.mode === v));
      btn.addEventListener("click", () => {
        S.mode = v;
        m.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === v)));
        renderList();
      });
      m.appendChild(btn);
    });
  }

  function renderList() {
    S.biz.forEach((st, i) => {
      const r = rows[i], b = BIZ[i];
      const owned = st.n > 0;
      r.el.classList.toggle("locked", !owned);
      r.el.classList.toggle("ready", owned && !st.run && !st.mgr);
      r.cnt.textContent = st.n;
      r.badge.disabled = !owned || st.mgr;
      r.mgr.hidden = !st.mgr;
      const t = cycleTime(i);
      if (owned) {
        const fast = t < 0.15 && (st.run || st.mgr);
        r.fill.style.width = (fast ? 100 : Math.min(1, st.p) * 100) + "%";
        r.rev.textContent = fast ? tl(cycleRev(i) / t) + " /sn" : tl(cycleRev(i));
        r.tm.textContent = (st.run || st.mgr) ? fmtTime(t * (1 - st.p)) : (st.mgr ? "" : "Tıkla");
      } else {
        r.fill.style.width = "0%";
        r.rev.textContent = "Kilitli";
        r.tm.textContent = fmtTime(t);
      }
      const k = buyCount(i);
      const c = costFor(i, k);
      const can = S.money >= c;
      r.buy.disabled = !can;
      r.buy.classList.toggle("can", can);
      r.bq.textContent = (owned ? "Al ×" : "Aç ×") + k;
      r.bc.textContent = tl(c);
      const nm = nextMilestone(st.n);
      r.ms.textContent = nm ? `${st.n}/${nm} → hız ×2` : "Tam hız";
    });
  }

  function renderStats() {
    $("money").textContent = tl(S.money);
    $("rate").textContent = tl(incomePerSec());
    $("fans").textContent = fmt(S.fans) + (S.fans ? ` · +%${fmt(S.fans * FAN_BONUS * 100)}` : "");
    const left = S.boostUntil - Date.now();
    const boost = $("boost");
    boost.hidden = left <= 0;
    if (left > 0) boost.textContent = `Derbi haftası ×2 · ${Math.ceil(left / 1000)} sn`;
    const tick = ticketValue();
    $("ticket").textContent = "Bilet sat +" + tl(tick);
  }

  // ---- Paneller ----
  function setTab(t) {
    S.tab = t;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    renderPanel(true);
  }
  let panelSig = "";
  let resetConfirm = false;
  function renderPanel(force) {
    // Paneli yalnızca içerik değiştiğinde yeniden kur; düğme durumlarını her karede güncelle
    const body = $("tabBody");
    let sig = S.tab + "|" + resetConfirm;
    if (S.tab === "mgr") sig += S.biz.map(b => b.mgr ? 1 : 0).join("");
    if (S.tab === "upg") sig += S.upg.length;
    if (S.tab === "fan") sig += S.fans + "|" + fansAvailable();
    if (force || sig !== panelSig) {
      panelSig = sig;
      body.innerHTML = "";
      if (S.tab === "mgr") buildManagers(body);
      if (S.tab === "upg") buildUpgrades(body);
      if (S.tab === "fan") buildFans(body);
    }
    body.querySelectorAll("[data-cost]").forEach(btn => { btn.disabled = S.money < +btn.dataset.cost; });
  }

  function card(title, desc, price, label, onClick, cls) {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="card-top"><span class="card-title"></span></div><div class="card-desc"></div>`;
    el.querySelector(".card-title").textContent = title;
    el.querySelector(".card-desc").textContent = desc;
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "act" + (cls ? " " + cls : "");
    btn.textContent = label;
    if (price != null) btn.dataset.cost = price;
    btn.addEventListener("click", onClick);
    el.querySelector(".card-top").appendChild(btn);
    return el;
  }

  function buildManagers(body) {
    const open = MANAGERS.filter(m => !S.biz[m.i].mgr);
    if (!open.length) { body.innerHTML = `<div class="empty">Bütün işletmelerin menajeri var. Artık her şey kendi kendine dönüyor.</div>`; return; }
    open.forEach(m => {
      body.appendChild(card(m.name, `${BIZ[m.i].name} işletmesini senin yerine sürekli çalıştırır.`, m.cost, tl(m.cost), () => {
        if (S.money < m.cost || S.biz[m.i].mgr) return;
        S.money -= m.cost; S.biz[m.i].mgr = true;
        toast(`${m.name} işe başladı: ${BIZ[m.i].name} artık otomatik.`);
        renderPanel(); renderList();
      }));
    });
  }

  function buildUpgrades(body) {
    const open = UPGRADES.filter(u => !S.upg.includes(u.id)).slice(0, 8);
    if (!open.length) { body.innerHTML = `<div class="empty">Bütün yükseltmeler alındı.</div>`; return; }
    open.forEach(u => {
      const what = u.target === -1 ? "Bütün işletmelerin" : BIZ[u.target].name;
      body.appendChild(card(u.name, `${what} kazancı ×${u.mult}`, u.cost, tl(u.cost), () => {
        if (S.money < u.cost || S.upg.includes(u.id)) return;
        S.money -= u.cost; S.upg.push(u.id);
        toast(`${u.name} alındı.`);
        renderPanel(); renderList();
      }));
    });
  }

  function buildFans(body) {
    const gain = Math.max(0, fansAvailable() - S.fans);
    const info = document.createElement("div");
    info.className = "card";
    info.innerHTML = `
      <div class="stat-label">Yeni sezonda kazanacağın taraftar</div>
      <div class="big-fans">+${fmt(gain)}</div>
      <div class="card-desc">Her taraftar bütün kazancı kalıcı olarak %2 artırır. Yeni sezona geçince kasa, işletmeler, menajerler ve yükseltmeler sıfırlanır; taraftarlar kalır.</div>
      <div class="card-desc">Şu an: ${fmt(S.fans)} taraftar · Toplam kazanç: ${tl(S.allTime)} · Sezon: ${S.seasons + 1}</div>`;
    body.appendChild(info);
    const row = document.createElement("div");
    row.className = "confirm";
    if (!resetConfirm) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "act red"; b.textContent = "Yeni sezona başla";
      b.disabled = gain < 1;
      b.addEventListener("click", () => { resetConfirm = true; renderPanel(); });
      row.appendChild(b);
      if (gain < 1) {
        const need = Math.pow(S.fans + 1, 2) * 1e8;
        const n = document.createElement("div");
        n.className = "empty";
        n.textContent = `İlk yeni taraftar için toplam ${tl(need)} kazanman gerekiyor.`;
        body.appendChild(n);
      }
    } else {
      const yes = document.createElement("button");
      yes.type = "button"; yes.className = "act red"; yes.textContent = `Evet, +${fmt(gain)} taraftarla başla`;
      yes.addEventListener("click", () => {
        resetConfirm = false;
        const keep = { allTime: S.allTime, fans: S.fans + gain, seasons: S.seasons + 1, mode: S.mode, tab: S.tab };
        S = freshState(keep);
        toast(`Yeni sezon! ${fmt(S.fans)} taraftar arkanda.`);
        renderAll(); save();
      });
      const no = document.createElement("button");
      no.type = "button"; no.className = "act"; no.textContent = "Vazgeç";
      no.addEventListener("click", () => { resetConfirm = false; renderPanel(); });
      row.append(yes, no);
    }
    body.insertBefore(row, body.children[1] || null);
  }

  // ---- Eylemler ----
  function earn(x) { S.money += x; S.earned += x; S.allTime += x; }
  function startCycle(i) {
    const st = S.biz[i];
    if (st.n < 1 || st.run || st.mgr) return;
    st.run = true; st.p = 0;
  }
  function buy(i) {
    const k = buyCount(i), c = costFor(i, k);
    if (S.money < c) return;
    const before = S.biz[i].n;
    S.money -= c; S.biz[i].n += k;
    const nm = MILESTONES.filter(m => m > before && m <= S.biz[i].n);
    if (before === 0) toast(`${BIZ[i].name} açıldı! Rozetine tıklayıp çalıştır.`);
    else if (nm.length) toast(`${BIZ[i].name} ${nm[nm.length - 1]} adede ulaştı: hız ×${Math.pow(2, nm.length)}`);
    renderList();
  }
  function ticketValue() { return Math.max(1, incomePerSec() * 0.05); }
  $("ticket").addEventListener("click", () => { earn(ticketValue()); renderStats(); });

  // Altın top: ara sıra çıkar, tıklayınca 30 sn ×2 kazanç
  let ballEl = null, nextBall = Date.now() + 45000;
  function spawnBall() {
    ballEl = document.createElement("button");
    ballEl.type = "button"; ballEl.className = "ball"; ballEl.textContent = "Derbi";
    ballEl.setAttribute("aria-label", "Derbi haftası: 30 saniye iki kat kazanç");
    const x = 16 + Math.random() * Math.max(0, window.innerWidth - 90);
    const y = 90 + Math.random() * Math.max(0, window.innerHeight - 200);
    ballEl.style.left = x + "px"; ballEl.style.top = y + "px";
    ballEl.addEventListener("click", () => {
      S.boostUntil = Date.now() + 30000;
      toast("Derbi haftası! 30 saniye boyunca bütün kazançlar ×2.");
      removeBall();
    });
    document.body.appendChild(ballEl);
    setTimeout(removeBall, 9000);
  }
  function removeBall() {
    if (ballEl) { ballEl.remove(); ballEl = null; }
    nextBall = Date.now() + 60000 + Math.random() * 90000;
  }

  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  // ---- Döngü ----
  function step(dt) {
    S.biz.forEach((st, i) => {
      if (st.n < 1 || !(st.run || st.mgr)) return;
      st.p += dt / cycleTime(i);
      if (st.p >= 1) {
        if (st.mgr) {
          const k = Math.floor(st.p);
          earn(cycleRev(i) * k);
          st.p -= k;
        } else {
          earn(cycleRev(i));
          st.p = 0; st.run = false;
        }
      }
    });
  }

  function renderAll() {
    buildModes();
    setTab(S.tab);
    renderList();
    renderStats();
  }

  let lastFrame = performance.now(), saveTimer = 0;
  function frame(now) {
    const dt = Math.min(1, (now - lastFrame) / 1000);
    lastFrame = now;
    step(dt);
    renderList();
    renderStats();
    renderPanel();
    if (!ballEl && Date.now() > nextBall && S.biz[1].n > 0) spawnBall();
    saveTimer += dt;
    if (saveTimer > 5) { saveTimer = 0; save(); }
    requestAnimationFrame(frame);
  }

  function offlineCatchUp() {
    const away = Math.min(8 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
    S.boostUntil = 0;
    if (away < 10) return;
    const before = S.money;
    let rest = away;
    // Menajerli işletmeleri toplu ilerlet
    S.biz.forEach((st, i) => {
      if (st.n < 1 || !st.mgr) return;
      const cycles = rest / cycleTime(i) + st.p;
      const k = Math.floor(cycles);
      earn(cycleRev(i) * k);
      st.p = cycles - k;
    });
    const got = S.money - before;
    if (got > 0) setTimeout(() => toast(`Sen yokken ${tl(got)} kazandın.`), 300);
  }

  // Sıfırla (sayfa içi onay)
  let resetArmed = false, resetTimer = 0;
  $("resetBtn").addEventListener("click", () => {
    const btn = $("resetBtn");
    if (!resetArmed) {
      resetArmed = true; btn.textContent = "Emin misin? Bütün ilerleme silinir. Tekrar tıkla.";
      resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = "Sıfırdan başla"; }, 4000);
      return;
    }
    clearTimeout(resetTimer); resetArmed = false; btn.textContent = "Sıfırdan başla";
    S = freshState();
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    renderAll(); toast("Oyun sıfırlandı.");
  });

  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  function start(hotData) {
    let ok = false;
    if (hotData && hotData.state) ok = load(hotData.state);
    if (!ok) {
      try { ok = load(JSON.parse(localStorage.getItem(SAVE_KEY) || "null")); } catch (e) {}
      if (ok) offlineCatchUp();
    }
    buildList();
    renderAll();
    requestAnimationFrame(t => { lastFrame = t; frame(t); });
  }

  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ state: S }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
